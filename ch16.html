<script>
window.CHAPTER = {
  no: 16, zh: '分娩前胎兒準備：循環分流與器官成熟', en: 'Preparing for Birth', color: '#38bdf8',
  summary: `
<h3>16-1 胎兒心血管並聯系統與三道分流（Fig 16.2）</h3>
<ul>
  <li><b>胎兒 vs 成人循環設計</b>：胎兒氣體交換由胎盤負責，因此兩心室採<b>並聯幫浦（右心室占總心輸出 2/3，左心室占 1/3）</b>，並由三道分流把高氧血送腦部而繞開尚未呼吸的肺臟。</li>
  <li><b>三道分流與血氧飽和度路徑（p.275–276）</b>：<ul>
    <li><b>① 靜脈導管（Ductus venosus）</b>：將臍靜脈 <b>90% 飽和氧血</b>大部分繞過肝臟直入下腔靜脈（混 20% 靜脈血 → <b>67%</b>）。</li>
    <li><b>② 卵圓孔（Foramen ovale）</b>：由界嵴（crista dividens）將 67% 血液大股引經左心房 → 左心室（<b>62%</b>）經頭臂動脈優先供應胎頭大腦。</li>
    <li><b>③ 動脈導管（Ductus arteriosus）</b>：低胎兒氧分壓（20–25 mmHg）使肺小動脈收縮產生<b>極高肺血管阻力</b>，把右心室射入肺動脈之血液（<b>52%</b>）大部分分流至降主動脈（達 <b>58%</b>）。</li>
  </ul></li>
  <li><b>出生瞬間轉換</b>：第一口呼吸肺擴張＋肺 P<sub>O₂</sub> 暴升使肺阻力崩降；臍循環中斷讓右心降壓、肺回流讓左心升壓 → 左心房瓣膜壓閉卵圓孔；高 P<sub>O₂</sub>＋<b>PGE<sub>2</sub> 下降</b>使動脈導管平滑肌收縮關閉（每 10,000 足月兒約 6 例未閉稱 PDA，可用 <b>Indomethacin</b> 抑制 PGE<sub>2</sub> 促使閉合）。永久解剖閉鎖時間：靜脈導管 ~3 月、動脈導管 ~1 年、卵圓孔在 ~10% 成人仍留探針縫。</li>
</ul>
<h3>16-2 肺泡表面張力素與皮質醇統御器官成熟（Fig 16.1, Table 16.1）</h3>
<ul>
  <li><b>胎兒呼吸練習</b>：每天於快速動眼睡眠（REM）期花 1–4 小時作純橫膈膜「胎兒呼吸動作」（-25 mmHg），促進肺擴張發育。</li>
  <li><b>表面張力素（Dipalmitoyl lecithin + apoprotein）</b>：第 18–20 週開始製造、臨產前 2 個月激增，降低肺泡表面張力防塌陷；羊水 <b>卵磷脂：神經鞘磷脂比（L/S ratio）&gt; 2</b> 表肺成熟，<b>&lt; 2</b> 易生新生兒呼吸窘迫症（RDS / 玻璃樣膜病）。</li>
  <li><b>胎兒皮質醇（Cortisol）的總指揮棒（Table 16.1）</b>：<ul>
    <li>誘導肺泡表面張力素合成與肺水分吸收（誘導腎上腺髓質與肺局部 <b>PNMT</b> 把正腎上腺素轉為腎上腺素＋升受體）。</li>
    <li>誘導肝臟末期酵素堆積<b>肝醣儲備（Fig 16.1）</b>、促使胎血由 HbF 切換成 HbA、造血遷入骨髓與脾臟。</li>
    <li>刺激腎皮質小管 <b>Na<sup>+</sup>/K<sup>+</sup>-ATPase</b> 提升腎留鈉力（早產兒漏鈉率達足月兒 3 倍！新生兒 GFR 僅成人的 1/3）。</li>
  </ul></li>
</ul>
<h3>16-3 消化道、甲狀腺、PTHrP 與神經痛覺分界（Box 16.1）</h3>
<ul>
  <li><b>消化／胰島</b>：胎糞（meconium）正常不於子宮內排出；α/δ 細胞較 β 細胞更早出現（第 10 週現胰島素）。</li>
  <li><b>甲狀腺（T₄）</b>：早期靠 hCG 刺激母甲狀腺及母體少量 T₄，後期靠胎盤脫碘酶供碘由<b>胎兒 TSH 驅動自產 T₄（足月濃過母體！）</b>，欠缺將致不可逆腦分化障礙與骨齡落後。</li>
  <li><b>鈣離子雙將</b>：胎兒副甲狀腺分泌 PTH 與 <b>PTHrP</b>（亦產自胎盤與成長板），PTHrP 負責任命調控跨胎盤主動運鈣，缺乏 PTHrP 小鼠出生即因骨化失敗致死。</li>
  <li><b>胎兒何時能感受痛覺？（Box 16.1, p.277–279）</b>：胎動約 8 週開始（14 週母感覺）；10 週皮膚有痛覺受器，15 週具脊髓反射（無腦兒亦有，並非痛覺！）；直至<b>第 24 週</b>前後才建立<b>丘腦—皮質（thalamocortical）</b>連接，且在子宮內疑受腺苷等抑制常處類睡眠狀態。</li>
</ul>`,
  quiz: [
    { q: '圖 16.2 中，為什麼從胎盤經臍靜脈回到胎兒體內的 90% 高飽和氧血液在進入右心房後，會有最大比例能優先繞道送往左心室供應「胎頭與大腦（62%）」，而非全部混進肺動脈或降主動脈？（p.275）', o: ['血液先經「靜脈導管（ductus venosus）」繞開肝臟，再由右心房的界嵴（crista dividens）將來自下腔靜脈的大股血引導直穿「卵圓孔（foramen ovale）」進入左心房', '因為胎兒的頭直接長在胎盤裡面不經過心臟', '因為靜脈導管直接連接胎兒左心室與大腦動脈', '因為肺靜脈在胎兒期攜帶 100% 滿飽和氧血入左心房'], a: 0, e: 'Ch16 p.275：同時因胎兒低氧（20–25 mmHg）使肺小動脈強力收縮產生極高肺阻力，迫使右心室打出的血主要改走動脈導管進入降主動脈。' },
    { q: '新生兒在出生時吸進第一口氣，是什麼兩股關鍵力量促使「動脈導管（ductus arteriosus）」與「卵圓孔」關閉？（p.276）', o: ['肺擴張與肺泡 Po₂ 急升大幅降低肺阻力並逆轉壓差把卵圓孔瓣膜壓閉；同時升高之 Po₂ 與血清 PGE₂ 驟降直接促使動脈導管平滑肌收縮關閉（未閉時可用 Indomethacin 抑 PGE₂ 協助閉合）', '臍帶內的平滑肌把導管機械拔斷', '母親產後的大量高濃度雌激素在胎兒主動脈結晶堵塞', '新生兒腎上腺大量分泌高濃度 PGE₂ 使動脈導管收縮'], a: 0, e: 'Ch16 p.276：PGE₂ 的生理作用是維持動脈導管「開放」而非關閉，因此出生後 PGE₂ 下降（配合動脈氧壓急升）與臨床使用 Indomethacin（抑 COX/PGE₂）方能促使導管收縮！' },
    { q: '羊水檢查「卵磷脂與神經鞘磷脂比例（L/S ratio，Fig 16.1）」為何可用來判斷早產兒是否會發生新生兒呼吸窘迫症（RDS / 玻璃樣膜病），以及胎兒什麼內分泌訊號能促發這種成熟？（p.276, Table 16.1）', o: ['二棕櫚醯卵磷脂為肺表面張力素主力且受「胎兒皮質醇（Cortisol）」與肺/腎上腺髓質 PNMT（促進腎上腺素）誘導於孕末急升；神經鞘磷脂則維持恆定作為基準。L/S &gt; 2 代表肺成熟，&lt; 2 則張力過大易塌陷', '卵磷脂高代表胎兒發生嚴重脂肪肝衰竭，必須延後出生', 'L/S 比是由胎盤 hCG 直接催化的，完全無關皮質醇', '神經鞘磷脂才是降低肺泡張力的唯一分子'], a: 0, e: 'Ch16 Fig 16.1 & p.276：給即將早產的孕母注射可過胎盤的合成皮質醇類似物（例如 betamethasone）正是搶救早產兒肺成熟與水分吸收的核心處置。' },
    { q: '關於胎兒器官準備離宮獨立的生理特徵，下列四項敘述中何者完全正確？（p.276–277, Table 16.1）', o: ['① 胎兒呼吸動作只出現於 REM 睡眠期間，有助肺部生長發育', '② 肝臟在臨產受皮質醇誘導大量合成貯存肝醣（應付斷臍後空腹期）；腎皮質小管受皮質醇誘導增加 Na⁺/K⁺-ATPase，早產兒漏鈉率可高達足月兒 3 倍', '③ 自然陰道產胸腔擠壓可經口腔排出部分肺液，其餘靠淋巴微血管及兒茶酚胺清除；選擇性剖腹產缺乏擠壓與產時應激激素激增故較易殘留肺水與呼吸適應問題', '以上三項（①、②、③）全數正確'], a: 3, e: 'Ch16 p.276–277 & Ch17 p.293：這三項在原文均有明確實證描述。注意胎兒排便（胎糞）通常不應在正常宮內發生，腎絲球過濾率出生時尚僅達 1/3，要 1.5–2 歲才完全成熟！' },
    { q: '根據英國皇家婦產科學院工作小組報告（Box 16.1）與神經生物學共識，「至少在妊娠第幾週之前」胎兒不大可能體驗有意識的痛覺（pain perception）？為什麼 15 週看到的縮腳反應不算證據？（p.277–279）', o: ['約妊娠第 24 週之前。因為 10 週的皮膚受器與 15 週的回縮反應屬純脊髓／腦幹反射（在無腦兒同樣存在）；處理主觀痛覺必須先建立連接大腦皮質的「丘腦—皮質（thalamocortical）纖維」，要到 ~24 週後才開始形成且胎兒仍處化學性類睡眠抑制中', '受精第 2 天囊胚緊實化時就已具完整皮質痛覺', '妊娠第 10 週起脊髓即與成人大腦完全髓鞘化連通', '胎兒直到出生 1 歲後才有任何感覺受器'], a: 0, e: 'Ch16 p.278 & Box 16.1：注意區分單純「組織傷害性反應（nociception / spinal reflex）」與有大腦皮質情緒認知參與的「痛覺（pain）」，長運動皮質脊髓束髓鞘化更延續到出生後方完成！' },
    { q: '關於胎兒鈣平衡激素「PTH」與「PTHrP（副甲狀腺素相關蛋白）」的分工與基因剔除後果，下列何者正確？（p.279–280）', o: ['雖然兩者皆回應胎兒低血鈣，但 PTHrP（由胎兒副甲狀腺、胎盤與骨骼等多處分泌）負責任命調控跨胎盤主動運鈣；缺乏副甲狀腺無 PTH 可被 PTHrP 代償，但基因剔除 PTHrP 的小鼠出生即因礦質化失敗而死！', '胎兒副甲狀腺要到出生後 5 歲才開始產生任何功能', '母體血中的 PTH 大量直接穿越胎盤幫胎兒運鈣', '胚胎的骨化程度和母體鈣供應完全沒有關聯'], a: 0, e: 'Ch16 p.279–280：高濃度的胎兒降鈣素（Calcitonin）則在相對高血鈣環境下協助保留骨化所需鈣質。' },
    { q: '關於妊娠期間母體與胎兒「甲狀腺素（T₄）」與「碘」的關係，下列何者正確？（p.279）', o: ['第一孕期主要靠母體 T₄ 少量跨盤支持；中後期母體 T₄ 通過量極有限且不足，必須依靠胎盤脫碘酶提供母源「碘」讓胎兒甲狀腺受胎兒 TSH 刺激自產高量 T₄（足月常高於母體）以促進中樞神經分化；懷孕早期母體因 hCG 刺激與 E₂ 拉高 TBG 也可能出現暫時性甲狀腺機能亢進', '胎兒甲狀腺素 100% 由母親足月供給，胎兒不需自產 T₄', '胎兒甲狀腺低下只影響毛髮，絕對不會造成智力與行為發育遲緩', '孕婦對碘的需求量在懷孕期降至零'], a: 0, e: 'Ch16 p.279：孕期母體腎清除率上升使碘流失較快，若缺碘可能誘發母體代償性甲狀腺腫並影響胎兒中樞神經系統發育！' },
    { q: '以下哪一項反應「不屬於」胎兒腎上腺皮質醇（Cortisol）在臨產前統籌的成熟切換任務？（Table 16.1）', o: ['誘發腎上腺髓質與肺的 PNMT 將正腎上腺素甲基化為腎上腺素，並促使肝臟累積肝醣與肺產表面張力素', '促成胎兒型血紅素（HbF）向成人型（HbA）切換並將造血重心轉往骨髓與脾臟', '促進胎兒腦垂腺分泌大量抑制黃體生長的 LH 以維持胎盤萎縮', '透過誘導羊等物種胎盤轉為高雌激素／低孕酮比例啟動分娩（並促腎小管 Na⁺/K⁺-ATPase 表現）'], a: 2, e: 'Ch16 Table 16.1：LH 並未受胎兒皮質醇這樣調控！其餘選項皆明確列於 Table 16.1 的臨產準備清單中。' }
  ]
};
