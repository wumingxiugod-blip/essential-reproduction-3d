window.CHAPTER = {
  no: 8, zh: '卵形成、濾泡發育與排卵黃體', en: 'Making eggs', color: '#f472b6',
  summary: `
<h3>8-1 卵巢構造與濾泡發育三階段（Figs 8.1–8.3, Tables 8.1–8.2）</h3>
<ul>
  <li><b>濾泡發育連續譜</b>：<b>原始濾泡</b>（20 µm，單層扁平顆粒細胞＋停於核網期 dictyate 之初級卵母細胞＋外圍基底膜 membrana propria）→ <b>腔前／初級濾泡</b>（200–400 µm；卵母細胞長至終尺寸 <b>60–120 µm</b> 並分泌 <b>透明帶 zona pellucida</b>；顆粒細胞伸出胞質突起穿過 ZP 與卵膜形成<b>間隙連接 gap junctions</b> 供應小分子營養；內外濾泡膜 theca interna/externa 形成）→ <b>腔狀濾泡</b>（濾泡液融合為單一濾泡腔 antrum；卵母細胞由<b>卵丘 cumulus oophorus</b> 包圍，壁層為壁顆粒細胞）→ <b>排卵前優勢濾泡</b>（人類約 <b>20–25 mm</b>）。</li>
  <li><b>內在發育 vs 腦垂腺依賴</b>：早期至腔前／早期腔狀（大鼠至晚腔前、人類至 ~2 mm）<b>不依賴 FSH/LH</b>，由卵內分泌因子（GDF-9、BMP-15、SCF/c-kit、LIF）與卵巢 <b>AMH 煞車</b>調節（Boxes 8.1–8.2）；其後無 FSH/LH 救援即走向<b>閉鎖（atresia）</b>，終生 ＜0.1% 濾泡能成功排卵。</li>
  <li><b>物種發育時長（Table 8.1）</b>：人類腔前期 77–85 天、腔狀期 8–12 天、排卵前期 30–36 小時、黃體期 12–15 天；小鼠則僅 6–10 天 / 3–4 天 / 11 小時 / 2 天。</li>
</ul>
<h3>8-2 兩細胞–兩促性腺激素類固醇合成與優勢濾泡選拔（Fig 8.4, Box 8.3）</h3>
<ul>
  <li><b>濾泡膜內層（Theca interna）</b>：具血管且表現 <b>LH 受體</b> → 在 LH 刺激下合成<b>雄烯二酮與睪固酮</b>。</li>
  <li><b>顆粒細胞層（Granulosa）</b>：完全<b>無血管</b>且在早期僅表現 <b>FSH 受體</b>，缺乏雄性素合成能力但將來自膜內層之雄性素經 FSH 誘導的<b>芳香酶（aromatase）</b>轉為<b>雌素二醇 E₂</b>。</li>
  <li><b>優勢濾泡正回饋（Box 8.3）</b>：FSH 誘導蛋白酶 <b>PAPP-A</b> 裂解 IGFBP 釋出游離 <b>IGF</b> 擴大芳香酶反應；高 <b>IGF:IGFBP</b> 與高 <b>Inhibin A:Activin</b> 比率使單一優勢濾泡（人類）爆衝分泌 E₂；同時 FSH＋E₂ 誘導外層壁顆粒細胞表現 <b>LH 受體</b>（僅約 14–20 顆中的 1 顆成熟排卵）。</li>
</ul>
<h3>8-3 排卵重啟減數分裂、黃體化與溶黃體機制（Figs 8.5–8.7, Table 8.3, Box 8.4）</h3>
<ul>
  <li><b>LH 潮湧效應</b>：① 透過卵丘抑制 cAMP、斷開微絨毛／間隙連接 → <b>生發泡破裂（GVBD）</b> → 排出<b>第一極體（PB1）</b>並再次停頓於<b>第二次減數中期（MII，受細胞靜止因子 CSF 維持）</b>（<b>狗與狐為例外，於 MI/初級卵母時期排卵</b>）；② 皮質顆粒移向卵膜下方；③ 壁顆粒細胞轉為分泌<b>助孕素（P₄）</b>（RU486 阻斷即不排卵）；④ <b>MMPs（膠原酶）與胞漿素原活化劑</b>分解排卵口（<b>stigma</b>）膠原壁釋出卵丘複合物。</li>
  <li><b>黃體與兩種溶黃體機制</b>：排卵後形成含大黃體細胞（源自顆粒細胞：產 P₄、<b>催產素</b>、抑制素 A）與小黃體細胞（源自膜細胞：P₄、A₄）；人類黃體亦產 E₂。
    <ul>
      <li><b>非靈長類（如綿羊，Fig 8.6）主動溶黃體</b>：長期 P₄ 使自身受體下調、容許子宮內膜表現 OT 受體 → 黃體 OT 促子宮內膜脈衝分泌 <b>PGF₂α</b> → 經<b>子宮靜脈至卵巢動脈之局部逆流轉運</b>抵達同側黃體，引發內皮素-1（endothelin-1）血管收縮與溶黃體（切除同側子宮角或結紮血管皆可阻止退化）。</li>
      <li><b>高等靈長類（人類）被動溶黃體</b>：無須子宮 PGF₂α，主因黃體期 LH 支持不足所致。</li>
    </ul>
  </li>
</ul>`,
  quiz: [
    { q: '為什麼腔狀濾泡內的顆粒細胞（granulosa cells）雖然距離微血管隔著一層基底膜（membrana propria），仍須靠哪一對胞間結構共同合作來製造雌素二醇 E₂ 與滋養卵母細胞？（Figs 8.2–8.4）', o: ['膜外層的平滑肌直接分泌雌激素給卵母細胞', '完全無血管的顆粒細胞藉穿過透明帶的胞質突起與卵母細胞形成「間隙連接」運送小分子養分，並接受來自富含血管之「濾泡膜內層（LH 刺激）」擴散而來的雄性素進行芳香化', '顆粒細胞可獨立從膽固醇一步合成雌激素不需膜細胞', '卵母細胞製造雄性素供應濾泡膜'], a: 1, e: 'Ch8 p.138–140, Figs 8.3–8.4：基底膜阻止血管進入顆粒層，故養分透過間隙連接輸送，E₂ 合成則仰賴「兩細胞–兩促性腺激素」合作。' },
    { q: '從 15–20 顆被徵招的小腔狀濾泡中脫穎而出成為人類唯一「優勢濾泡（dominant follicle）」的局部細胞激素特徵為何（Box 8.3）？', o: ['表現大量未裂解的 IGFBP 鎖住 IGF，且高活化素低抑制素', '高度表現蛋白酶 PAPP-A 裂解 IGFBP 以提高游離 IGF，並具高「抑制素 A：活化素」比率，在低 FSH 下持續暴增 E₂ 並誘導壁顆粒細胞表現 LH 受體', '完全關閉自身芳香酶表現', '提早於腔前階段大量分泌催產素'], a: 1, e: 'Ch8 Box 8.3：PAPP-A 與高 IGF:IGFBP、高 Inhibin A:Activin 構成正向螺旋，僅優勢濾泡能獲得顆粒細胞 LH-R 迎接 LH 潮湧。' },
    { q: '排卵前 LH 潮湧引發卵母細胞的「第一次減數分裂恢復」與細胞質成熟，下列哪一對物種與其他大多數哺乳類不同，排出的是「仍停於第一次減數分裂（初級卵母細胞）」的卵？（Fig 8.5）', o: ['人類與牛', '狗與狐（排卵後才完成第一減數分裂並排出第一極體）', '小鼠與大鼠', '綿羊與豬'], a: 1, e: 'Ch8 Fig 8.5 圖說：大多哺乳類排卵時已排出 PB1 並停在 Metaphase II，唯獨狗與狐在 MI 時期即排卵。' },
    { q: '排卵前壁顆粒細胞的類固醇分泌出現關鍵轉換（switch），開始大量分泌助孕素（progesterone）。若在排卵前給予助孕素受體拮抗劑（如 mifepristone / RU486），會產生什麼結果（p.143–144）？', o: ['誘發雙倍數量的卵泡同時排卵', '完全抑制排卵（因排卵所需蛋白酶活化與壁層破裂高度依賴局部助孕素訊號）', '促使未成熟濾泡提早黃體化', '無任何影響'], a: 1, e: 'Ch8 p.144：助孕素受體基因剔除雌鼠或給予 RU486 皆無法排卵；MMPs（如膠原酶）與 plasminogen activator 需要此訊號協助破開 stigma。' },
    { q: '在未懷孕的母綿羊進行實驗（Fig 8.6）：若僅外科切除「左側（與左卵巢黃體同側）」的子宮角，保留右側子宮角，結果左側卵巢黃體會發生什麼變化？', o: ['照常如期迅速溶黃體萎縮', '延遲或無法發生溶黃體（因為子宮內膜 PGF₂α 須經同側子宮靜脈與卵巢動脈的局部逆流血管交換，無法經對側遠距送達）', '轉變成惡性腫瘤', '對側卵巢會立刻排卵'], a: 1, e: 'Ch8 Fig 8.6：PGF₂α 經過單次肺循環即會被大量滅活，故在羊／牛等家畜必須依賴同側子宮靜脈→卵巢動脈的局部逆流轉運。' },
    { q: '綿羊等物種的「黃體催產素（oxytocin）」為何要等到黃體期後段才激發子宮內膜大量釋放 PGF₂α 造成溶黃體（Box 8.4）？', o: ['黃體早期完全不製造催產素', '早期持續高濃度的助孕素會壓抑子宮內膜「催產素受體」表現；直到長期暴露使助孕素受體自身下調（auto-regulation）後，催產素受體與雌激素受體才得以表現並啟動正回饋迴路', '催產素早期全部被排進尿液', 'PGF₂α 必須等待胎盤成熟才合成'], a: 1, e: 'Ch8 Box 8.4：受體調控機制決定時鐘！一旦 OT 受體出現，OT 促 PGF₂α、PGF₂α 又反促黃體 OT 與血管收縮素 Endothelin-1 形成毀滅性正回饋。' },
    { q: '人類等高等靈長類（human）的黃體退化（luteolysis）與綿羊／牛最根本的機制差異為何（p.145–146）？', o: ['人類黃體亦完全依賴子宮分泌 PGF₂α 逆流破壞，切除子宮會讓黃體永久存活', '人類子宮切除術或抗 PGF₂α 抗體皆不會延長黃體壽命；人類溶黃體主要屬「被動性（黃體期 LH 促黃體支持不足）」，而非子宮主動分泌 PGF₂α', '人類完全沒有黃體', '人類黃體是由濾泡膜外層纖維化形成而無大黃體細胞'], a: 1, e: 'Ch8 p.145–146：在高等靈長類是因缺乏足夠的促黃體激素（LH，除非受精後有胎盤 hCG 拯救）導致被動退化。' },
    { q: '卵巢濾泡發育至哪一個階段開始在顆粒細胞分泌出透明帶（zona pellucida），且哪一種卵巢細胞激素會抑制「原始濾泡」過早被大量徵招消耗（Box 8.1）？', o: ['原始濾泡；GnRH', '腔前／初級濾泡形成透明帶；生長中濾泡顆粒細胞分泌的 AMH（抗穆勒氏管激素）抑制原始濾泡庫過度招募', '黃體期形成透明帶；催產素抑制徵招', '僅在受精後形成透明帶；PGF₂α 抑制徵招'], a: 1, e: 'Ch8 p.138 & Box 8.1：卵母細胞於腔前階段分泌 ZP 醣蛋白；AMH 敲除鼠會加速原始濾泡庫提前耗竭。' }
  ]
};
</script>
