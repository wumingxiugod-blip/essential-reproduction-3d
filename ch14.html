window.CHAPTER = {
  no: 14, zh: '胎兒生長、胎盤運輸與生理代謝', en: 'Growing the Fetus', color: '#7c8cf8',
  summary: `
<h3>14-1 胎兒生長曲線、棕色脂肪與羊水動力循環（Figs 14.1–14.2, Box 14.1）</h3>
<ul>
  <li><b>生長速率曲線</b>：懷孕 20 週前較慢，於<b>第 30–36 週達到最大成長速度</b>隨後減緩（足月時胎盤／胎兒重量比顯著下降）。第 32 週後主要為「細胞體積增大」；蛋白質於第 35 週達 ~300 g 上限，第 38 週起皮下脂肪超越蛋白質重量（足月脂肪儲能為蛋白質的 3 倍）。過小（<b>SGA</b>，&lt;2500 g 或 &lt;2 SD；三分之一足月低體重兒屬 IUGR）與過大皆拉高新生兒死亡率（Fig 14.1）。</li>
  <li><b>生長內分泌軸</b>：母體平均增重 ~13 kg；孕婦可分為省能型（-13,000 kcal）或高耗型（+80,000 kcal），除非重度營養不良（&lt;1600 kcal/day）否則是「依食慾進食」。<b>胎兒 IGF1</b>（不靠胎兒垂體 GH！而隨營養／胰島素／甲狀腺素與葡萄糖負荷調節）直接促進胎兒合成代謝；<b>IGF2</b>（血中為 IGF1 的 2–3 倍）主要刺激胎盤生長與胺基酸轉運。</li>
  <li><b>棕色脂肪（Brown fat）五處解剖熱源</b>：介於兩肩胛骨間菱形片、頸部血管周、腋下、縱隔（食道／氣管間及內乳血管周）與腎臟－腎上腺周；富含多房脂滴與高密度脊粒線體，負責新生兒關鍵<b>非顫抖生熱作用</b>（心臟肌含高肝醣抗缺氧，但大腦全無肝醣極怕新生兒低血糖）。</li>
  <li><b>羊水循環與臨床（Box 14.1, Table 14.2）</b>：8 週 15 ml → 20 週 450 ml → 34 週後淨產歸零；每 <b>3 小時全部水分完全更新一次</b>！孕中後期胎腎尿液（25w 3–5 ml/h → 40w <b>26 ml/h = 500–600 ml/day</b>）為主力輸入、胎兒吞嚥（16w 7 ml/h → 28w <b>120 ml/h</b>）為主要輸出：腎缺損致<b>羊水過少（Potter’s syndrome）</b>；無腦兒／食道閉鎖無法吞嚥致<b>羊水過多</b>；神經管缺損時羊水 <b>α-胎兒蛋白（AFP）</b>暴增。</li>
</ul>
<h3>14-2 胎盤薄化與跨膜五類運輸機轉（Figs 14.3–14.4）</h3>
<ul>
  <li><b>擴散距離縮短</b>：懷孕早期終末絨毛直徑 150–200 μm、分隔厚 10 μm；足月縮細為 40 μm 且胎兒微血管貼至表面下僅剩 <b>1–2 μm</b>。</li>
  <li><b>簡單擴散（氣體、水、電解質、尿素、非結合類固醇）</b>：CO<sub>2</sub> 擴散常數為 O<sub>2</sub> 20 倍；水可經滲透與靜水壓穿過胎盤與羊膜（母體 P<sub>4</sub> 競爭醛固酮受體＋E<sub>2</sub> 促血管張力素原 → <b>醛固酮暴增 10 倍</b>儲水鈉！）。注意胎盤本身就耗去整個單位 <b>40–60%</b> 的氧與葡萄糖！</li>
  <li><b>促進擴散（葡萄糖）</b>：胎兒缺低氧下糖質新生能力（出生升壓升高 P<sub>O₂</sub> 方啟動），全仰賴母血濃差驅動（極限 0.6 mmol/min/g，僅 >20 mmol/L 才飽和）；孕後期 <b>hPL</b> 使母體產生<b>胰島素阻抗（促生脂肪分解）</b>把血糖讓渡胎兒。糖尿病母體使胎兒高胰島素巨嬰，且剪臍帶後母糖中斷易致危險<b>新生兒低血糖</b>！</li>
  <li><b>選擇性富含 LCPUFA</b>：透過胎盤脂酶與脂肪酸結合蛋白使胎血 <b>DHA &gt; AA &gt; α-次亞麻油酸 &gt; 亞麻油酸</b>，第三孕期胎兒 <b>LCPUFA 濃度達母親 2–14 倍</b>供給大腦視網膜發育。</li>
  <li><b>耗能主動運輸（胺基酸、鐵、鈣、維生素 B₁₂ / 葉酸）</b>：<ul>
    <li><b>胺基酸</b>：<b>胎盤 P<sub>4</sub> 抑制母肝胺基酸去胺作用</b>使母體尿素排出下降，不需額外高蛋白飲食即留足氮源再主動泵向胎兒（胎兒亦靠 IGF2 反向增加轉運體表現）。</li>
    <li><b>鐵</b>：胎兒血中游離鐵為母體 <b>2–3 倍</b>（鐵蛋白複合體轉運，供應胎兒 300 mg）；第 3 孕期母體吸收率從 10% 升至 30%+。</li>
    <li><b>鈣（21 g）</b>：Mg<sup>2+</sup>-ATPase 鈣泵逆梯度運輸（<b>80% 累積於第三孕期</b>，高達 150 mg/kg/day）；母體 25-OH-VitD 可過胎盤活化，PTH 與 1,25-(OH)<sub>2</sub>D 不直接過胎盤。</li>
  </ul></li>
  <li><b>巨分子唯一特例——IgG 受體胞吞（FcRn）</b>：人類自第 13 週起單方向主動轉運母體 IgG 提供被動免疫（鼠兔靠卵黃囊胎盤；牛羊豬僅靠出生後初乳吸收）。</li>
</ul>
<h3>14-3 雙重波爾效應（Double Bohr）與膽紅素排除（Figs 14.5–14.6, Table 14.1）</h3>
<ul>
  <li><b>O<sub>2</sub> 搶奪三道利器（Fig 14.5, Table 14.1）</b>：臍靜脈 P<sub>O₂</sub> 僅 <b>30 mmHg</b>（對比母動脈 90 mmHg），含氧量卻高達 <b>13 vol.%</b>（接近母動脈 14 vol.%）：① 胚型（ε 鏈）與胎兒型 <b>HbF（α₂γ₂）</b>對 <b>2,3-DPG 不敏感</b>；② 部分物種胎兒 2,3-DPG 較低；③ <b>雙波爾效應（Double Bohr，額外貢獻約 10% 氧轉移）</b>：胎血 CO<sub>2</sub> 擴散過胎盤使母血 pH 降（促釋 O<sub>2</sub>），同時胎血 pH 升（7.26 → 7.35，促抓 O<sub>2</sub>）。</li>
  <li><b>膽紅素排除與生理性黃疸（Fig 14.6）</b>：胎兒肝臟接近足月前極度缺乏 <b>UDP-葡萄糖醛酸轉移酶（UDPGT）</b>；脂溶性「未結合膽紅素」自由擴散過胎盤入母血，由母肝結合為極性「膽紅素葡萄糖醛酸苷」（無法回穿！）隨母膽汁排出！出生若臍帶過晚夾閉或助孕素／早產抑酶即生新生兒黃疸，極重度須照光或換血以防<b>核黃疸（kernicterus）</b>。</li>
</ul>`,
  quiz: [
    { q: '為什麼足月胎兒離開胎盤時臍靜脈的氧分壓（Po₂）只有 30 mmHg（遠低於母體動脈 90 mmHg），其血液「含氧量（oxygen content）」卻高達 13 vol.%（幾乎追上母親動脈血的 14 vol.%）？（Table 14.1, Fig 14.5）', o: ['胎兒血紅素 HbF（α₂γ₂）缺成人 β 鏈對 2,3-DPG 不敏感而有極高氧親和力，並結合胎盤內的「雙重波爾效應（Double Bohr effect）」在胎側 pH 上升時搶抓更多氧氣', '因為胎兒血管裡面的氧氣是以純氣泡狀態運送', '因為母親紅血球直接穿過胎盤進入胎兒心臟', '因為胎兒細胞的粒線體完全不消耗氧氣'], a: 0, e: 'Ch14 p.249–250 & Fig 14.5：母血接收胎兒 CO₂ 後 pH 下降（促 HbA 放氧），胎血排走 CO₂ 後 pH 由 7.26 升至 7.35（促 HbF 鎖氧），雙重波爾效應額外助益約 10% 氧氣跨胎盤運送。' },
    { q: '懷孕中的婦女儘管需應付生長中胎兒的龐大蛋白質需求，為何課本指出一般飲食健康孕婦並不必然需要「大量補充額外蛋白質」？（p.253）', o: ['因為高濃度胎盤助孕素（P₄）抑制母體肝臟對胺基酸的去胺作用（deamination），使母體尿素排泄大幅下降、氮保存利用率提升，保留的胺基酸隨即由胎盤轉運蛋白主動泵入胎兒血中', '因為胎兒可以直接從空氣吸入氮氣合成全部胺基酸', '因為胎兒肌肉完全不含蛋白質，僅由脂肪構成', '因為孕婦小腸消化率從 50% 暴升至 1000%'], a: 0, e: 'Ch14 p.253：反而在正常孕婦過度補充高蛋白多數僅被去胺當成熱量消耗；而當母體胺基酸供應偏低時，胎兒會透過提升轉運體表現試圖補償（受 IGF2 等調控）。' },
    { q: '關於懷孕中期以後母親血糖代謝的適應、妊娠糖尿病對胎兒的影響，以及剛出生的嬰兒為何可能突然出現危險的「新生兒低血糖」，下列連鎖機轉何者最精確？（p.250, 252）', o: ['孕後期胎盤泌乳素（hPL）促使母親周圍組織產生胰島素阻抗而多用游離脂肪酸，將母血葡萄糖留給胎盤促進擴散；若母體高血糖會刺激胎兒自身胰島大量分泌「胎兒胰島素」導致巨嬰與脂肪暴增，出生剪臍帶切斷母糖瞬間，殘留的高胰島素隨即引發新生兒劇烈低血糖（腦部因無肝醣貯存極危）', '母體高血糖使母親胰島素大量穿過胎盤進入胎兒大腦', '胎兒早在懷孕第 10 週就能在低氧下高速進行強效糖質新生', '新生兒心臟完全沒有肝醣，而大腦儲存最多肝醣'], a: 0, e: 'Ch14 p.250, 252：胎兒在低動脈 Po₂ 下幾乎無糖質新生能力（出生 Po₂ 升起方啟動）；胎兒心肌肝醣極高能抗缺氧，大腦則零肝醣全仰賴循環血糖！' },
    { q: '比較人體內的脂溶性「未結合膽紅素」與水溶性「結合態膽紅素葡萄糖醛酸苷」在胎盤兩側的流向，為何嚴重溶血或過早出生的嬰兒易出現核黃疸（kernicterus）？（Fig 14.6, p.254–255）', o: ['胎兒肝臟在出生前幾乎沒有 UDP-葡萄糖醛酸轉移酶，脂溶性「未結合膽紅素」會順濃差擴散過胎盤交給母體肝臟結合（極性結合物不能回流！）排入母膽汁；出生後切斷胎盤若新生兒肝臟不成熟或晚斷臍致紅血球破壞大增，未結合膽紅素飆高穿透血腦障壁', '胎盤會主動分泌大量膽紅素毒害胎兒腦幹', '母肝結合後的膽紅素葡萄糖醛酸苷會全數逆流毒死胎兒', '照射紫外線光療（phototherapy）會抑制胎兒所有膽紅素降解'], a: 0, e: 'Ch14 p.254–255 & Fig 14.6：紫外線光療是將皮膚的脂溶性膽紅素光異構化轉為不需肝臟結合即可排出的無毒水溶性衍生物。' },
    { q: '下列五項孕期跨胎盤運輸或新生兒適應的「關鍵數字與物質」配對中，哪一項完全符合第 14 章原文敘述？', o: ['胎兒血 LCPUFA（DHA>AA>α-亞麻油酸>亞油酸）濃度於足月可達母體 2–14 倍（供給第 3 孕期腦／視網膜發育）', '胎兒骨化所需約 21 g 鈣中 80% 係透過胎盤 Mg²⁺-ATPase 主動鈣泵在「第三孕期」送入；但母體 PTH 與 1,25-(OH)₂D 並不穿過胎盤', '人類唯獨 IgG 免疫球蛋白能藉合胞滋養層 Fc 受體介導胞吞（自第 13 週起線性上升）穿過胎盤；而羊水水分每 3 小時即完全更換一次', '以上 A、B、C 三項皆完全正確'], a: 3, e: 'Ch14 p.251–255 & Box 14.1：A（p.253）、B（p.254）、C（p.251 & 255）全部精準吻合原廠課文！注意牛羊豬在母體內因上皮絨毛阻隔不經胎盤傳 IgG，必須在生後靠初乳獲得。' },
    { q: '關於妊娠中後期羊水體積異常的兩大典型病理原因，下列敘述何者正確？（Box 14.1）', o: ['腎臟缺如（Potter’s syndrome）因缺主要後段羊水尿液來源造成「羊水過少（oligohydramnios）」；無腦兒或食道閉鎖因胎兒無法正常吞嚥消耗（原為 120 ml/h）造成「羊水過多（polyhydramnios）」', '羊水自第 8 週後就完全靜止不動，直到分娩都不會任何交換', '神經管缺損（如脊柱裂）會使羊水中 α-胎兒蛋白（AFP）降到零', '母體與胎兒紅血球每小時各自隨尿液進入羊膜腔 500 ml'], a: 0, e: 'Ch14 Box 14.1：羊膜上皮本身亦具主動調節與交換能力（無胎兒實驗中仍能維持羊水生成），且羊水含白蛋白僅為血清 5%。' },
    { q: '調控胚胎與胎兒生長速度的最核心胎兒內分泌因子（IGF1 與 IGF2）之比較與生長節奏（p.246–247, Fig 14.2），何者正確？', o: ['胎兒成長速率在 30–36 週達高峰（32 週後轉以細胞肥大為主）；血中濃度較高的 IGF2 主導刺激「胎盤」生長與胺基酸轉運，而 IGF1 則直接反應母體供給之營養與胎兒胰島素刺激胎兒組織合成生長（並非受胎兒 GH 控制！）', '胎兒在 36–40 週一直維持呈指數加速分裂，從不減速', '胎兒的 IGF1 是由胎兒垂體分泌大量生長激素（GH）直接啟動的，缺 GH 即立即死亡', '第 38 週前脂肪重量永遠是蛋白質的三倍'], a: 0, e: 'Ch14 p.246–247：胎兒組織缺乏足夠的 GH 受體，因此出生前的成長主要受營養感測型的 IGF1/2 與胰島素／甲狀腺素驅動，而非出生後才主導的 GH-IGF1 軸！' },
    { q: '為什麼人類胎兒／新生兒在肩胛間（菱形）、頸血管周、腋下、縱隔及腎周保有豐富的「棕色脂肪（Brown fat）」，而在發育過程中的角色與白色脂肪有何不同？（p.252）', o: ['棕色脂肪細胞含多房小脂滴與密集大型粒線體，能進行「非顫抖性生熱作用（non-shivering thermogenesis）」為缺乏肌肉顫抖禦寒能力的新生兒維持體溫；白色脂肪則是靠胎兒胰島素將過剩葡萄糖貯存備用', '棕色脂肪只負責潤滑胎盤產道協助順產', '白色脂肪的粒線體數量比棕色脂肪多 100 倍', '棕色脂肪僅存在於成年雄性鼠的副睪內'], a: 0, e: 'Ch14 p.252：棕色脂肪於新生兒期隨成長及體溫調節成熟逐步退化。' }
  ]
};
