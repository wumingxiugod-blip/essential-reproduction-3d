window.CHAPTER = {
  no: 21, zh: '老化更年期、不孕診治與輔助生殖技術', en: 'Restoring Fertility', color: '#a78bfa',
  summary: `
<h3>21-1 生殖老化、更年期反轉與男女差異（Figs 21.1–21.4, Table 21.1）</h3>
<ul>
  <li><b>臨床低生育力（Subfertility，約 10–15% 伴侶）</b>：規律無避孕性行為滿 <b>12 個月</b>未受孕；男女因子各占相當比例，三大可解釋病因佔 75–80%：<b>輸卵管受損（淋病/披衣菌等致纖毛/傘沾黏）、排卵異常、精子缺陷（另 ~25% 不明原因）</b>（Fig 21.1）。</li>
  <li><b>女性生物鐘與 35 歲轉折（Figs 21.2–21.3）</b>：女性卵母細胞自胎兒期固定不再補充並滯留減數分裂，<b>20 多歲生殖力最高</b>，35 歲起急遽下滑主因「老卵之 MII 紡錘體不穩、染色體離散（非整倍體↑）」！進入 40 歲出頭出現 <b>更年期過渡（Climacteric，可長達 10 年）</b>直到最後月經（<b>停經 Menopause，美國均齡 52 歲</b>；約 2% 早發停經）。</li>
  <li><b>更年期荷爾蒙變遷（Table 21.1）</b>：早期小腔前濾泡銳減 → <b>Inhibin B 先跌 → FSH 率先上升</b>（甚至短暫催熟縮短濾泡期！）；接近停經時 <b>Inhibin A 與 E₂ 徹底崩跌 → LH 隨後大升</b>；但腎上腺＋受高 LH 刺激的卵巢間質細胞仍產雄激素（相對雄性化與骨鬆／潮熱）。值得注意的是，只要給予外源性激素建立內膜並移植「年輕捐贈卵／胚胎」，停經後婦女 50–60 歲仍能成功足月分娩！</li>
  <li><b>男性老化（Fig 21.4）</b>：<b>無相當於更年期的生殖細胞枯竭！</b>精液量、活力與濃度從 20 歲起漸進平緩下降，但 40 歲後精子突變率上升與糖尿病／血管性功能問題（如勃起障礙）增加，血漿睪固酮多仍維持於行為閾值之上，常規補雄激素尚無明確實證益處且須權衡攝護腺癌風險（p.344–345）。</li>
</ul>
<h3>21-2 不孕內分泌／解剖病因與體外受精微操家族（Figs 21.5–21.7, Table 21.2）</h3>
<ul>
  <li><b>排卵障礙與對策</b>：<ul>
    <li><b>高泌乳素血症</b>（妊娠、多巴胺拮抗精神藥或 <b>Prolactinoma</b>）：抑制脈衝性 LH → 給 <b>D₂ 致效劑（Bromocriptine）</b>兼具抗有絲分裂縮瘤效果，2 個月內多數恢復排卵。</li>
    <li><b>下視丘—垂體不足</b>：以皮下<b>脈衝式 GnRH 幫浦</b>模擬生理最不易多胞胎；對比外源促性腺激素須防過度刺激。</li>
    <li><b>特發性無排卵／PCOS（5–10% 女性）</b>：口服抗雌激素 <b>Clomiphene（第 2–6 或 5–9 天）</b>阻斷下視丘負回饋↑GnRH/FSH（使用前可作「5 天助孕素撤退試驗 Progesterone challenge」測體內 E₂ 是否足夠！）。<b>PCOS</b> 表現多量小濾泡卡在早期腔狀、<b>高 LH 低/正常 FSH</b> 與高胰島素阻抗／高雄激素，易因刺激過度引發 OHSS（或可行腹腔鏡卵巢電燒鑽孔）。</li>
    <li><b>LUF 症候群（黃素化未破裂濾泡）</b>：內分泌數值看起來全正常，卻把卵鎖死在黃體裡沒排出來！</li>
  </ul></li>
  <li><b>男性不孕（Table 21.2）</b>：低於 2 ml、&lt;20×10⁶/ml、總數 &lt;40×10⁶、前向活動 &lt;50%、畸形 &gt;70%。<b>阻塞性無精症（約 50% 帶囊腫性纖維化 CF 異合突變！）</b>睾丸大小正常、可用 <b>PESA（副睪穿刺）</b> 或 <b>TESE（睪丸切片）</b>取精；<b>非阻塞原發衰竭</b>常因失抑制素致 <b>FSH 異常高</b>（預後差）。</li>
  <li><b>ART 核心技術（Fig 21.5）</b>：<b>IVF</b>（約 25% 每週期活產／懷孕率，先用 GnRH 類似物如 Buserelin 下調防偷排 → rFSH 追蹤 → hCG 取卵）、<b>GIFT</b>（混合配子放回正常輸卵管）、<b>ZD（透明帶鑽孔，易多精入卵）</b>、<b>SUZI（卵周隙微注）</b>、<b>ICSI（卵質內單精子注射，可救極少、無動力或甚至不表現 Izumo1 的精細胞！）</b>。</li>
</ul>
<h3>21-3 冷凍保存、PGD 與粒線體疾病「卵重組」（Fig 21.8）</h3>
<ul>
  <li><b>冷凍保存（-196°C 液態氮／氣相）</b>：慢速冷凍或玻璃化（vitrification）搭配抗凍劑（精子 1950s、胚胎 1980s、卵子與卵巢組織條近成熟）。</li>
  <li><b>胚胎著床前遺傳診斷／篩檢（PGD / PGS）</b>：可採極體、Day 2–3（1–2 分裂球）或 Day 5 滋養層切片；經 WGA 擴增以 <b>aCGH</b> 或 <b>SNP 晶片（唯一可供單倍體分型 haplotyping）</b>驗單基因、染色體非整倍體或救命手足（saviour sibling）。</li>
  <li><b>粒線體疾病之「受精卵原核移植重組」（Fig 21.8）</b>：粒線體（含 37 個基因，嚴格母系遺傳，有異質性 heteroplasmy 閾值效應）致病母與夫之受精卵，將<b>父母雙原核移入「已去核之健康捐贈者受精卵質」</b> → 子代保有雙親 100% 核基因與健康捐贈者之粒線體！</li>
  <li><b>胚胎幹細胞（ESCs）生殖限制（p.352）</b>：實驗雖可將動物幹細胞分化為似配子細胞，但 XX 基因組不相容精子形成、缺乏雙 X 則不相容卵子發生，故單靠一方體細胞難以直接為同性伴侶製造「異性配子」。</li>
</ul>`,
  quiz: [
    { q: '為什麼女性一過 35 歲生育力（Fig 21.3）便開始加速暴跌，而到了 40 餘歲進入更年期過渡（Climacteric）時血液荷爾蒙又呈現什麼順序變化？（p.342–343, Table 21.1）', o: ['最初衰退主因胎兒期即暫停的卵母細胞「MII 紡錘體穩定度下降致染色體非整倍體↑」，接著濾泡數耗損使「Inhibin B 先降、FSH 率先升高」（甚至縮短濾泡期），直到臨停經前 Inhibin A 與 E₂ 皆跌才見 LH 上升', '因為女性 35 歲時子宮徹底消失，但年輕卵子移植也永遠無法在 50 歲子宮著床', '因為 FSH 與 LH 在更年期全都永久掉到零', '因為女性每隔 10 年會靠骨髓重新長出 100 萬顆全新原始卵細胞'], a: 0, e: 'Ch21 p.342–344：把年輕捐贈卵受精後植入荷爾蒙重建後的 50–60 歲停經子宮依然能成功懷孕足月，證明女性生理繁殖鐘的主因在卵巢／卵母細胞而非子宮老化！' },
    { q: '關於男性的年齡與生殖能力變化（Fig 21.4），下列敘述何者與女性最不相同？（p.344–345）', o: ['男性沒有相當於女性更年期的「生殖細胞徹底枯竭」，很多男性終其一生都能製造有受精能力之精子；但精液量、活動力與濃度自 20 歲起緩步下滑，精子自發突變率與老化後繼發的性功能衰退增加（血睪固酮通常未低於行為閾值）', '男性一過 52 歲睪丸就會徹底停止分泌睪固酮與精子', '年長男性給予高劑量外源性睪固酮被證實能把精蟲數增加 10 倍且零前列腺風險', '男性 60 歲以上精子的突變率比 20 歲更低'], a: 0, e: 'Ch21 p.344–345：外源睪固酮會負回饋壓抑 LH/FSH 反而使生精停滯！且年長男性的老化性障多屬血管、糖尿病與神經衰老等「老化病變（senescence）」。' },
    { q: '遇到月經不來（無排卵）的患者時，醫師為何常先開立 5 天合成助孕素作「助孕素挑戰測試（Progesterone challenge test）」，若停藥後出現撤退性出血代表什麼意思？（p.348）', o: ['代表患者卵巢仍能產生足夠的「內源性雌激素」把子宮內膜先增生預敏（ER→PR），因此口服抗雌激素「Clomiphene（解除下視丘負回饋）」有約 70% 成功促排卵機會；反之若全無出血則多須改用外源性促性腺激素治療', '代表患者已經懷孕 8 個月且必須立即手術', '代表患者徹底缺乏大腦垂體與下視丘', '代表助孕素在無雌激素存在下也能直接使子宮增生剝落'], a: 0, e: 'Ch21 p.348：Clomiphene 除了在下視丘競爭雌激素受體解除負回饋提升 FSH/LH，也能在卵巢刺激芳香化酶活性。' },
    { q: '關於常見的「多囊性卵巢症候群（PCOS，佔育齡婦女 5–10%）」與「黃素化未破裂濾泡（LUF）」，兩者的內分泌與濾泡表現各為何？（p.348–349）', o: ['PCOS 具有 2–3 倍過多小濾泡但全卡在早期腔狀期無優勢篩選，表現高雄激素、胰島素阻抗與「LH 持續偏高但 FSH 未高」（異於停經前高 FSH！）；LUF 則是荷爾蒙波看起來像正常排卵並黃素化，實則卵子被鎖死在未破濾泡內！', 'PCOS 患者對任何促排卵藥物完全麻痺絕對不會發生卵巢過度刺激（OHSS）', 'LUF 是指男方沒有輸精管的阻塞性無精症', 'PCOS 的特徵是血中完全測不到 LH 且只有 FSH 暴高'], a: 0, e: 'Ch21 p.348–349：注意 PCOS 卵巢對 Clomiphene 與 FSH 極為敏感，很容易因誘發過度產生危險的卵巢過度刺激症候群（OHSS），因此使用時必須密切超音波追蹤！' },
    { q: '當一對夫婦男方確診「阻塞性無精症（obstructive azoospermia）」需經 PESA / TESE 取精進行 ICSI（卵質內單精子注射）時，為何臨床遺傳諮詢特別提醒要檢查約 50% 患者帶有的哪一項基因？且「非阻塞性」衰竭男方的 FSH 又常呈現什麼狀態？（p.349–350）', o: ['阻塞性無精症（睾丸體積正常）患者約半數帶有「囊腫性纖維化（Cystic Fibrosis, CF）異合突變」，做 ICSI 有遺傳給下一代的風險！相對地，非阻塞性生精衰竭者因缺賽托利細胞抑制素（Inhibin B）負回饋，常表現異常偏高的「FSH（預後不良）」', '皆帶有 PR-B 突變且血中 LH/FSH 全為零', 'ICSI 在阻塞性無精症絕對無效，必須先做輸精管與輸卵管接合手術', '囊腫性纖維化患者反而天生比正常人射精量多 5 倍'], a: 0, e: 'Ch21 p.349–350：ICSI 把單隻副睪精子（PESA）或睪丸精子／精細胞（TESE）直接注入卵質，繞過了運動、獲能、頂體反應與膜融合所有天然屏障！' },
    { q: '比較圖 21.5 的四種人工協助受精方式：<b>IVF、ZD（透明帶鑽孔）、SUZI（卵周隙微注）、ICSI（胞質內單精注射）</b>，何者最需警覺「多精入卵（polyspermy）」副作用？何者在做 IVF 傳統超排卵第一步往往反而會先給「GnRH 類似物（如 Buserelin）」好幾天？（p.345–346, Fig 21.5）', o: ['ZD 預先在透明帶開孔助弱精進入，卻破壞了自然透明帶反應防線而容易「多精入卵」；傳統 IVF 先連用多日 GnRH 類似物是為了「讓垂體受體下調關閉女性自身的 LH 潮湧以免取卵前偷排」，再用 rFSH 均勻長大最後由 hCG 精準控制排卵前取卵！', 'ICSI 一次注射 100 隻精子進入細胞質最常引發十倍體多精入卵', '給 IVF 病人先打多日 Buserelin 是為了立即刺激當小時排卵', 'SUZI 是把整顆卵巢從腹部拉進陰道受精'], a: 0, e: 'Ch21 p.345–346 & Fig 21.5：GIFT 則是把採出的卵與精混合放回正常的輸卵管內受精，因此只適用於雙側輸卵管通暢者。' },
    { q: '圖 21.8 展示了一種針對嚴重「粒線體遺傳疾病（mtDNA 突變，如失聰／失明／心肝衰竭）」家族所設計的新穎生殖重建策略，請問它是如何讓雙親在「維持 100% 親生核基因血緣」的前提下，生出不發病的寶寶？（p.351–352, Fig 21.8）', o: ['將帶著異常粒線體的患者卵母細胞與夫精受精成受精卵後，只吸出「父母的雌雄原核」，移植進「已經去核、帶有正常粒線體的健康捐贈者受精卵質」中（Pronuclear transfer）！', '只把精子粒線體注射 100 萬顆進去替換掉卵子的粒線體', '先做 PGD 一定能直接挑出 0% 突變的胚胎，因為母親所有卵都不帶異質性（heteroplasmy）突變', '在懷孕第 30 週給胎兒吃抗生素消滅全部粒線體'], a: 0, e: 'Ch21 p.351–352 & Fig 21.8：過去也曾有將健康卵胞質直接注入病卵的「胞質移植」實驗（2001 停用）；粒線體具 37 個基因與母系遺傳特質，原核移植使母系突變粒線體殘留量壓到極低（低於臨床發病閾值）。' },
    { q: '在胚胎著床前基因診斷（PGD）的晶片分析技術中，為什麼「SNP 陣列（Single Nucleotide Polymorphism arrays）」比同樣可透過全基因組擴增（WGA）檢查染色體套數異常的「aCGH（陣列比較基因組雜交）」多出一項獨特優勢？而體細胞／ESCs 用於同性伴侶造配子的生理限制為何？（p.351–352）', o: ['只有「SNP 陣列」能額外進行單倍體分型（haplotyping，如配對救命手足或追蹤遺傳連鎖）；而 ESCs 難替同性伴侶製造「異性配子」是因兩條 X 染色體（女-女）與生精過程不相容，缺乏兩條 X（男-男）則與正常卵細胞發生不相容！', '只有 aCGH 可以測定基因單倍體序列而 SNP 完全測不到染色體異常', '用人類 XY 男性體細胞誘導出的 ESCs 只要在培養皿加雌激素就可以輕鬆大量生出完全健康的單倍體人類卵子', 'PGD 的切片只能從懷孕第 38 週的羊水取得胎兒皮膚細胞'], a: 0, e: 'Ch21 p.351–352：結合 Ch2 的性染色體對減數分裂生精/卵子發生調控結論（XY 缺雙 X 難過卵母細胞減數停滯；XX 具雙 X 在睪丸抑制生精！）。' }
  ]
};
