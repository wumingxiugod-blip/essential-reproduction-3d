<script>
window.CHAPTER = {
  no: 12, zh: '早期分裂、著床與母體妊娠辨識', en: 'Initiating Pregnancy', color: '#e56b92',
  summary: `
<h3>12-1 著床前分裂、緊實化與囊胚分化（Figs 12.1–12.4, Tables 12.1–12.2）</h3>
<ul>
  <li><b>概念體／胚胎期畫分（Table 12.2）</b>：人類前 14 天屬<b>胚胎生成期（embryogenic phase，稱概念體 conceptus，Day 3–4 即有 &gt;95% 細胞形成胚外胎盤組織）</b>→ 接著約 6 週為<b>胚胎期（embryonic）</b>建立體軸器官 → 第 9 週至分娩為<b>胎兒期（fetal，約 220 天）</b>。</li>
  <li><b>基因接管與透明帶（Table 12.1）</b>：早期分裂無淨成長，僅降低胞質核比。控制權由卵源母體 mRNA 轉給胚胎基因轉錄的時刻隨物種而異：<b>鼠 2-細胞、豬 4-細胞、人 4–8-細胞、兔/羊/牛 8–16-細胞</b>。<b>透明帶</b>防止緊實化前分裂球散落成同卵雙胞胎，亦防兩個體融合為嵌合體（chimaera）。</li>
  <li><b>緊實化（Compaction）與囊胚（Fig 12.3）</b>：8–16 細胞桑椹胚細胞扁平極化（微絨毛／內體居頂端、核居基底），外膜形成<b>緊密連接（zonular tight junctions）</b>鎖住液體形成囊胚腔：外圈 <b>Cdx2 / Eomes 滋養層（Trophoblast）</b>與偏心內側 <b>Oct 3/4 / Nanog 上胚層（Epiblast）+ GATA6 下胚層（Hypoblast）</b>合稱 <b>Pluriblast（ICM）</b>。</li>
  <li><b>同卵雙胞胎分化時刻（Fig 12.4）</b>：緊實化前分裂（40%：雙絨毛雙羊膜，半數二次融合）；ICM 分裂（60%：<b>單絨毛雙羊膜</b>，常具血管吻合引發雙胎輸血症候群）；胚盤晚裂（&lt;2%：單絨毛單羊膜或連體嬰）。</li>
</ul>
<h3>12-2 著床窗口分子對話與侵入機轉（Figs 12.5, 12.8–12.9, Box 12.3）</h3>
<ul>
  <li><b>三態內膜切換</b>：前接受期（厚 <b>Muc1</b>「走開」醣萼、長微絨毛、強負表面電位）→ <b>接受窗口（Window of implantation）</b>→ 抵抗期（過早或遲到皆排斥著床）。</li>
  <li><b>內分泌調控雙步驟</b>：高 P₄ 下，管腔與腺體上皮的 <b>PR 下調</b>以解除對分泌的抑制；隨後由卵巢（豬由概念體自產）提供<b>雌激素（E₂）</b>打開窗口！E₂（搭配 <b>Hmx3</b>）促腺體分泌關鍵「來這裡」激素 <b>LIF</b> → 上皮雙聚體受體 <b>LIFRα:gp130 → Jak → Stat3</b> 活化，引發局域／全面 <b>HB-EGF</b> 與 amphiregulin 結合囊胚 <b>EGFR + HSPG</b> 促使透明帶脫出（hatching）與貼附；同時 <b>Muc1</b> 減少、<b>胞飲突（pinopodes）</b>吸收管腔液促進宮腔閉合。</li>
  <li><b>侵入與脫膜反應</b>：人、猴、鼠等行<b>侵入型著床</b>，滋養層融合形成多核<b>合胞滋養層（Syncytiotrophoblast）</b>與增生性<b>細胞滋養層</b>侵蝕基質，<b>PLA₂ → Cox2 → PGI₂ → PPARδ</b> 驅動類發炎水腫、聚倍體脫膜細胞、<b>IL-11</b>、<b>VEGF/PlGF/PDGF</b> 血管新生與 <b>MMPs vs TIMPs</b> 平衡制衡。</li>
  <li><b>延遲著床／滯育（Delayed implantation / Diapause，Box 12.3）</b>：<b>兼性延遲</b>（哺乳中大/小鼠吸吮抑制 E₂ 高峰）；<b>專性滯育</b>（歐洲麅 7–8 月交配但囊胚滯育至隔年 1 月著床，5–6 月食源最豐時分娩）。人、兔、豬不發生滯育。</li>
</ul>
<h3>12-3 比較胎盤型態與母體妊娠辨識（Figs 12.6–12.7, 12.10, Table 12.3）</h3>
<ul>
  <li><b>胎盤形態與穿透分層（Table 12.3）</b>：人（間質侵入／圓盤狀／<b>單層血絨毛 haemomonochorial</b>）；兔（偏心侵入／<b>雙層血絨毛 haemodichorial</b>）；大/小鼠（<b>三層血絨毛 haemotrichorial</b>）；犬貓（環帶狀 zonary／<b>內皮絨毛 endotheliochorial</b>）；豬馬（中央非侵入／彌散型 diffuse，豬囊胚 D6 2 mm → D12 暴長成 <b>1000 mm</b>／<b>上皮絨毛 epitheliochorial</b>）；牛羊（約 90 顆子宮阜 cotyledonary／胎兒雙核細胞融合母體上皮稱<b>融合上皮絨毛 synepitheliochorial</b>）。</li>
  <li><b>延長黃體壽命兩大策略（Fig 12.10）</b>：
    <ul>
      <li><b>靈長類（hCG）</b>：受精後第 6–7 天起合胞滋養層分泌 <b>hCG</b> 結合黃體 LH 受體延長孕酮分泌＋鬆弛素（抗 hCG β 鏈抗體可精準觸發流產／溶黃體）。</li>
      <li><b>反芻類（羊／牛 IFN-τ）</b>：滋養層分泌 <b>干擾素-τ（IFN-τ / TP-1）</b>結合 IFNAR1/2 誘導轉錄抑制子 <b>IRF-2</b>，直接封鎖內膜<b>催產素受體基因</b>表現以阻斷 PGF₂α 脈衝釋放。</li>
      <li><b>豬（雙波概念體 E₂）</b>：D11–13 與 D15–30 分泌 <b>E₂</b>，將 PGF₂α 由血液內分泌改道為向子宮腔內的<b>外分泌降解</b>，並上升 PGE 與黃體 LH/PRL 受體（p.221–222）。</li>
    </ul>
  </li>
</ul>`,
  quiz: [
    { q: '為什麼將哺乳動物受精後最初約 14 天（人類）的發育產物更精確地稱為「概念體（conceptus / pre-embryo）」而非「胚胎（embryo）」？同時其早期分裂球有何特徵？（p.207–209, Table 12.2）', o: ['最初兩週主要致力於分化出占細胞總數 &gt;95% 的「胚外支持組織（胎盤絨毛等）」來包裹少數未來才會發育為胎兒的多能細胞群，期間細胞持續減小但概念體總體積幾乎不變', '因為人類受精卵前兩週內尚未開始任何 DNA 複製', '因為前 14 天全是單倍體細胞', '因為真正的心臟已在第 3 天開始跳動'], a: 0, e: 'Ch12 p.207–209 & Fig 12.2：第 3–4 天起超過 95% 細胞已成為胚外組織；真正形成體軸的胚胎期在人類約持續第 3–8 週（共 ~36 天）。' },
    { q: '比較人、鼠、豬與牛的早期胚胎在發育第幾細胞時期會出現「胚胎自身基因大幅轉錄接管（major burst of transcription）」以及何時常在體外培養遇到阻滯？（Table 12.1, Box 12.1）', o: ['鼠在 2-細胞、豬在 4-細胞、人類在 4–8-細胞、羊/牛/兔在 8–16-細胞期啟動主要胚胎轉錄（往往也是體外培養容易發生「block」的瓶頸階段）', '全哺乳類皆在受精後 1 小時於 1-細胞期就完全消滅所有母體 mRNA', '所有物種一律等到著床後第 20 天才開始使用胚胎自己的基因', '僅有牛具有胚胎基因，鼠與人全靠卵母細胞蛋白活到出生'], a: 0, e: 'Ch12 Table 12.1 & p.210–212：母體遺傳的 mRNA 會於胚胎轉錄啟動前後逐步降解，但早先已譯出的母源蛋白質仍可殘存至囊胚期協助過渡。' },
    { q: '緊實化（compaction）與隨後囊胚形成過程中的極化結構及分子標記分布，下列何者正確？（Figs 12.2–12.3）', o: ['8–16 細胞期外露細胞獲得頂端膜與 zonular 緊密連接，表現 Cdx2/Eomes 成為外圍「滋養層（Trophoblast）」並能鎖水膨大成囊胚腔；內側無外露細胞成為表現 Oct 3/4 / Nanog 的「內細胞團／多能胚層（Pluriblast）」', '緊實化必須完全消化分解透明帶後方能在輸卵管內發生', '雙胞胎輸血症候群最常見於「緊實化前分裂（Type 1/2 雙絨毛）」而非 ICM 分裂（Type 3）', 'Trophoblast 是未來構成大腦與脊髓的唯一前驅'], a: 0, e: 'Ch12 Figs 12.2–12.4：緊實化先建構上皮化極性與不對稱分裂，方能決定內外兩群命運；約 60% 同卵雙胞胎在 ICM 分裂（單絨毛雙羊膜）故可能發生雙胎血管交通問題。' },
    { q: '在人類、大鼠等子宮內膜準備進入「著床接受窗口（Window of implantation）」時，為什麼雌激素（E₂）的出現不可或缺，而且之前助孕素（P₄）的受體反而必須在管腔／腺體上皮細胞下調（down-regulated）？（p.217–219）', o: ['P₄ 雖促腺體製造養分但抑制其分泌，上皮 PR 消失才解除分泌鎖定；此時 E₂（合併 Hmx3）方能刺激腺體分泌關鍵細胞激素 LIF，透過上皮 LIFRα:gp130 → Jak → Stat3 上調 HB-EGF 打開著床敏感窗口', '因為 P₄ 與 E₂ 直接物理溶解所有囊胚避免侵入', '因為人類是上皮絨毛非侵入性胎盤不需要 E₂ 與 LIF', '因為上皮細胞出現大量長微絨毛與增厚 Muc1 才能直接刺破囊胚'], a: 0, e: 'Ch12 p.217–219, Figs 12.8–12.9：著床時先關掉「走開」訊號（降解表面抗黏附醣蛋白 Muc1、胞飲突吸收液體促宮腔閉合），再開啟「來這裡」訊號（LIF → Stat3 → HB-EGF）。' },
    { q: '比較豬/馬、牛/羊、犬/貓、人類/鼠的「胎盤型態與血液－胎兒屏障分層」，下列何者全對？（Table 12.3, Figs 12.6–12.7）', o: ['人類為間質侵入・圓盤狀・單層血絨毛（haemomonochorial）；小鼠為三層血絨毛（haemotrichorial）；豬馬為非侵入中央彌散・上皮絨毛；牛羊為子宮阜・胎兒雙核細胞與母體上皮融合的「融合上皮絨毛（synepitheliochorial）」', '人類胎兒紅血球直接跟母親紅血球無屏障混流於同一個胎盤血管中', '小鼠胎盤層數比人類更少（零層細胞屏障）', '豬的囊胚極小（直徑僅 0.1 mm）且 6–12 天間毫無伸長即直接鑽入內膜'], a: 0, e: 'Ch12 Table 12.3 & p.215–217：豬著床前從 D6 的 2 mm 暴長為 D12 的 1000 mm 絲狀膜以廣布彌散交換養分；層數少未必代表交換效率更高，只是採用的跨膜運輸機制不同！' },
    { q: '為什麼人類與高級靈長類孕婦在黃體原本應於第 12–14 天退化時卻維持高孕酮，此機制如何運作、實驗證據為何？（p.221, Fig 12.10）', o: ['合胞滋養層自受精後第 6–7 天即分泌絨毛膜促性腺激素 hCG 進入母血結合黃體 LH 受體取代衰竭的腦垂腺 LH 支撐；注射專一中和 hCG β-鏈（不結合 LH）之抗體即會使黃體依舊退化而終止妊娠', '靈長類囊胚分泌干擾素 IFN-τ 關閉子宮前列腺素', '人類大腦下視丘直接在第 7 天分泌大量 PGF₂α 保護黃體', '靈長類根本沒有黃體期，一受精就直接移除兩側卵巢也能自然受孕第 1 天存活'], a: 0, e: 'Ch12 p.221 & Fig 12.10：實驗中針對 CG 專一 C 端胜肽抗體在月經週期照常正常、排卵與受精照常下，僅因中和 hCG 即精準阻斷懷孕。' },
    { q: '大型反芻家畜（羊、牛）與豬皆不產生類似 hCG 的絨毛膜促性腺激素，牠們各自用什麼核心分子機制進行「母體妊娠辨識」避免黃體溶萎？（p.221–222）', o: ['牛羊概念體分泌「滋養層干擾素 IFN-τ」誘發轉錄抑制子 IRF-2，壓抑子宮內膜「催產素受體」表現以阻斷 PGF₂α 釋放；豬概念體於 D11–13 與 15–30 分泌 E₂ 將 PGF₂α 從血液內分泌「轉道外分泌」入子宮腔代謝', '牛羊靠人類完全一樣的 hCG；豬靠垂體每天兩次 PRL 潮湧', '牛羊概念體直接咬斷卵巢動脈；豬完全沒有 PGF₂α 合成能力', '反芻類與豬靠胎兒自己製造的睪固酮維持妊娠'], a: 0, e: 'Ch12 p.221–222：豬概念體雖分泌 IFN-γ 與 IFN-δ 協助維持早期妊娠，但不具抗溶黃體作用；真正逆轉 PGF₂α 分泌方向的是胚胎自行合成的雙波雌激素！' },
    { q: '歐洲麅（roe deer）每年盛夏 7–8 月交配，卻直到隔年 1 月囊胚才甦醒著床並於 5–6 月產子；這與哺乳中大鼠延後第二胎著床在分類上有何不同？（Box 12.3）', o: ['歐洲麅為寫在生活史中的「專性胚胎滯育（obligate diapause）」確保初夏養分最豐時生產；哺乳大鼠則是受吸吮抑制母體 E₂ 高峰引發的「兼性延遲著床（facultative delayed implantation）」以避免新生小鼠被哥哥姐姐搶奶', '兩者皆只由胎盤缺氧引起', '人類孕婦每次哺餵母乳也都必然發生 6 個月胚胎滯育', '專性滯育的動物不具備囊胚期'], a: 0, e: 'Ch12 Box 12.3：人工卵巢切除加上每日注射 P₄ 即可在小鼠重現延遲著床，單劑 E₂ 即刻喚醒胚胎著床；但人類、兔、豬、天竺鼠與倉鼠均無此滯育現象。' }
  ]
};
