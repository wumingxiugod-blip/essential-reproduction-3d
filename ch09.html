window.CHAPTER = {
  no: 9, zh: '女性生殖週期與子宮調節', en: 'Women', color: '#fb7185',
  summary: `
<h3>9-1 物種卵巢週期模式比較（Table 9.1, Figs 9.1–9.2）</h3>
<table>
  <tr><th>物種</th><th>總週期 (天)</th><th>濾泡期 (天)</th><th>黃體期 (天)</th><th>核心機制差異</th></tr>
  <tr><td><b>人類 Human</b></td><td>24–32</td><td>10–14</td><td>12–15</td><td>自發排卵；黃體期性腺激素低，下一批濾泡於溶黃體後才展開腔狀成長</td></tr>
  <tr><td><b>牛 Cow / 豬 Pig</b></td><td>牛 20–21 / 豬 19–21</td><td>牛 2–3 / 豬 5–6</td><td>牛 18–19 / 豬 15–17</td><td>「壓縮重疊（telescoped）」：上一週期黃體期內即進行腔狀濾泡擴張</td></tr>
  <tr><td><b>鼠／大鼠（獨處 vs 假孕）</b></td><td>4–5（假孕 13–14）</td><td>2</td><td>2–3（假孕 11–12）</td><td>極短黃體期；交配刺激子宮頸啟動每日兩次 <b>PRL 潮湧</b>維持黃體成假孕</td></tr>
  <tr><td><b>兔 Rabbit（獨處 vs 交配）</b></td><td>1–2（假孕 14–15）</td><td>1–2（連續）</td><td>0（假孕 13）</td><td><b>誘發／反射排卵（Box 9.1）</b>：無自發排卵，交配刺激子宮頸誘發 LH 潮湧 10–12h 排卵</td></tr>
</table>
<h3>9-2 卵巢激素雙相回饋與 GnRH 自我預敏（Figs 9.4–9.12, Boxes 9.2–9.4）</h3>
<ul>
  <li><b>雌素二醇（E₂）雙相作用</b>（Fig 9.4）：
    <ul>
      <li><b>低～中濃度（快速負回饋）</b>：1 小時內起效、4–6 小時達最大，抑制弓狀核 <b>KISS1</b> 與垂體，壓低 LH/FSH；降低 GnRH 脈衝振幅。</li>
      <li><b>高濃度持續（＞200–400% 且維持 36–48 小時 → 正回饋）</b>：引發腦垂腺前葉與下視丘大量釋放 GnRH/LH 形成<b>排卵前 LH 潮湧</b>（Fig 9.11 羊門脈血 GnRH 暴衝）。</li>
    </ul>
  </li>
  <li><b>助孕素（P₄）雙重負效應</b>：強化 E₂ 負回饋（主要減慢 <b>GnRH/LH 脈衝頻率</b>至長間隔高振幅脈衝，Fig 9.10d），並<b>徹底阻斷 E₂ 的正回饋作用</b>（黃體期即使注入高 E₂ 也不排卵！）。</li>
  <li><b>抑制素專一壓抑 FSH</b>：濾泡期 <b>Inhibin B</b>、黃體期 <b>Inhibin A</b> 作用於垂體前葉降低對 GnRH 的 FSH 反應。</li>
  <li><b>垂體 GnRH 自我預敏（Self-priming，Box 9.2, Fig 9.9）</b>：在 E₂ 存在下，前一次 GnRH 脈衝將更多分泌顆粒移至膜下，使下一次脈衝產生數倍放大的 LH 釋放。</li>
  <li><b>靈長類 vs 囓齒類腦部性別差異（Box 9.4, Fig 9.13）</b>：大鼠新生期睪固酮使雄鼠下視丘失去 E₂ 正回饋能力；<b>靈長類男性下視丘並未被「男性化」</b>，去勢後仍可出現 E₂ 正回饋！</li>
</ul>
<h3>9-3 月經週期內膜、螺旋動脈與子宮頸黏液（Figs 9.14–9.18）</h3>
<ul>
  <li><b>發情週期（Oestrous）vs 月經週期（Menstrual）</b>：非靈長類以發情行為第 1 天起算（溶黃體後無月經、內膜重吸收）；人類／猿／舊世界猴以<b>月經來潮（內膜脫落）第 1 天</b>起算。</li>
  <li><b>子宮內膜三期（Fig 9.15）</b>：<b>增生期（E₂ 主導）</b>基質增生水腫、誘發<b>助孕素受體（PR）</b>、子宮肌層趨向頸向底（cervico-fundal）蠕動助運精 → <b>分泌期（P₄ 主導）</b>腺體盤曲分泌肝醣黏蛋白、特徵性<b>螺旋動脈（spiral arteries）</b>捲曲發育、uNK 細胞聚集（占白血球主力）、肌層安靜 → <b>月經期（P₄ 撤退）</b>螺旋動脈收縮缺血並脫落排出。</li>
  <li><b>子宮頸黏液與體溫（Fig 9.17）</b>：排卵前高 E₂ 誘導 <b>Muc5B/Muc4</b> 水性凝膠網，<b>牽絲度（spinnbarkeit）與羊齒狀結晶（ferning）達峰值</b>，精子穿透率最高；排卵後 P₄ 使黏液量驟減變稠、阻擋精子與病原，並作用於下視丘體溫中樞使基礎體溫（BBT）上升。</li>
</ul>`,
  quiz: [
    { q: '比較人類與豬／牛卵巢週期的結構差異，為何牛（20–21 天）與豬（19–21 天）的「濾泡期」只有 2–6 天，遠短於人類的 10–14 天？（Table 9.1, Fig 9.1）', o: ['牛與豬的卵母細胞比人類小 10 倍，不需生長', '在牛與豬，前一個週期的黃體期內 LH/FSH 並未降到像人類那麼低，因此下一批腔狀濾泡早在「上一個黃體期」就已同步擴張（telescoped）', '牛與豬沒有黃體期', '人類的濾泡只在青春期發育一次'], a: 1, e: 'Ch9 p.152–153, Fig 9.1：人類黃體期兼具大量 E₂ 與 Inhibin A 強烈壓抑 FSH/LH，導致腔狀擴張必須等溶黃體後才從頭開始。' },
    { q: '未交配的大鼠週期僅 4–5 天，但與結紮輸精管（不孕）的公鼠交配後會延長為 13–14 天的「假孕（pseudopregnancy）」，其核心神經內分泌機轉為何？（p.153–154）', o: ['精液中的睪固酮直接延長黃體壽命', '交配時陰道與子宮頸受機械刺激，經感覺神經上傳中樞誘發垂體前葉每日兩次「泌乳素（PRL）潮湧」持續約 10 天以維持黃體', '雌鼠大腦直接分泌 hCG', '假孕是因為輸卵管發生阻塞'], a: 1, e: 'Ch9 p.154 & Table 8.3：在鼠／大鼠，泌乳素是黃體滋養複合體（luteotrophic complex）的核心成員，無交配刺激則黃體 2–3 天即退化（主產 20α-OHP）。' },
    { q: '若對雌性恆河猴注射大量苯甲酸雌素二醇（oestradiol benzoate），血漿 LH 與 FSH 在時間軸上會出現何種雙相反應？（Fig 9.4）', o: ['立即持續上升 10 天不降', '先在 1–6 小時內快速下降（負回饋），若高濃度維持約 36–48 小時後，反而引發大量 LH/FSH 潮湧（正回饋）', '全程皆被完全抑制至零', '僅 FSH 上升而 LH 下降'], a: 1, e: 'Ch9 Fig 9.4：E₂ 負回饋反應快（4–6h）；正回饋需要高濃度（200–400%↑）並維持 ~36–48h 才觸發排卵潮湧。' },
    { q: '為何在正常月經週期的「黃體期」，即使血漿中由黃體分泌的雌素二醇濃度回升至相當於排卵前的水平，卻不會再度誘發 LH 潮湧與排卵？（p.156, 158）', o: ['因為黃體期下視丘完全沒有任何 GnRH 神經元', '因為黃體分泌的高濃度助孕素（P₄）大幅減慢 GnRH 脈衝頻率並徹底阻斷 E₂ 的正回饋效應（同時子宮內膜也已無可用濾泡）', '因為腦垂腺在黃體期完全喪失對 GnRH 的反應能力', '因為血液中的白蛋白把全部 E₂ 摧毀'], a: 1, e: 'Ch9 p.156–158 & Fig 9.8：事實上黃體期垂體對外源 GnRH 仍高度敏感，真正阻斷潮湧的是 P₄ 對下視丘／正回饋的強力封鎖。' },
    { q: '觀察人類女性月經週期不同時期的 10 分鐘抽血頻譜（Fig 9.10），濾泡期與黃體期的「LH 脈衝模式」各有何特徵？', o: ['濾泡期高頻低振幅（約每小時 1 次）；黃體期受 P₄ 影響轉為「低頻（可間隔長達 6 小時）、高振幅」脈衝', '濾泡期完全無脈衝；黃體期每 5 分鐘一次高頻脈衝', '兩期脈衝頻率完全相同', 'LH 在正常女性體內呈連續平坦分泌毫無脈衝'], a: 0, e: 'Ch9 p.158–160, Fig 9.10：高 E₂ 降振幅、高 P₄ 降頻率（拉長間隔後單次釋放量反而大），反映下視丘 GnRH 脈衝產生器的改變。' },
    { q: '關於雌激素（E₂）與助孕素（P₄）在子宮內膜週期的受體調控與結構作用，下列敘述何者正確（p.167–168）？', o: ['助孕素不需先經雌激素作用即可直接使子宮內膜強烈分泌', '增生期高 E₂ 最關鍵的作用之一是誘導子宮細胞表現「助孕素受體（PR）」，使排卵後的內膜能對 P₄ 反應進入分泌期（腺體捲曲、螺旋動脈發育）', '雌激素使子宮肌層完全靜止無蠕動', '螺旋動脈只在男性前列腺出現'], a: 1, e: 'Ch9 p.167–168：P₄ 必須作用於「經 E₂ 預敏（primed）」的子宮內膜！增生期由 E₂ 誘導出 PR，這是生殖受體調控的經典範例。' },
    { q: '排卵期前後女性子宮頸黏液（cervical mucus）在高雌激素（低助孕素）下呈現的典型變化為何（Fig 9.17）？', o: ['黏液量極少且變稠，牽絲度幾乎為零', '分泌大量含 <b>Muc5B 與 Muc4</b> 之水性凝膠基質，<b>牽絲度（spinnbarkeit）與玻片乾燥後的羊齒狀結晶（ferning）皆達最高峰</b>，最利精子穿透', '精子穿透率降至全年最低點', '完全由中性顆粒球填滿阻斷'], a: 1, e: 'Ch9 p.168 & Fig 9.17：高 E₂ 促 Muc5B/Muc4 形成供精子游動的水性通道網；低劑量助孕素避孕藥或緊急避孕藥正是破壞此變化以阻擋精子。' },
    { q: '比較非靈長類（大鼠）與高等靈長類（猴、人）下視丘對「雄性素決定成年正回饋能力」的實驗結論，何者正確（Box 9.4, Fig 9.13）？', o: ['雄性大鼠與雄性人類的下視丘皆在胎兒期被睪固酮徹底男性化，兩者成年去勢後均完全無法產生 E₂ 正回饋 LH 潮湧', '大鼠新生期雄性素會永久取消成年雄鼠的 E₂ 正回饋；但靈長類男性在子宮內暴露於睪固酮並未「男性化」正回饋中樞，成年去勢男猴與男性仍能對 E₂ 潮湧產生 LH 潮湧', '靈長類女性在胎兒期暴露過量雄性素（如 CAH）成年後就絕對沒有月經週期', '大鼠雌鼠永遠無法產生 LH 潮湧'], a: 1, e: 'Ch9 Box 9.4 & Fig 9.13：這是本書極重要的跨物種警訊，絕對不能直接將大鼠的「下視丘性腺化」硬套至靈長類與人類！' }
  ]
};
