<script>
window.CHAPTER = {
  no: 13, zh: '胎膜演化、胎盤血流與內分泌協作', en: 'Supporting the Embryo & Fetus', color: '#45c49e',
  summary: `
<h3>13-1 組織滋養 → 血液滋養轉型與胎膜演化（Figs 13.1–13.3, Box 13.1）</h3>
<ul>
  <li><b>孕期計算</b>：以末次月經（LMP）第 1 天起算，臨床稱「懷孕 12 週」實際僅受精後 10 週、黃體挽救後 8 週。</li>
  <li><b>第一孕期：組織滋養（Histiotrophic，第 1–12 週）</b>：主要利用脫膜崩解物與子宮腺體豐沛分泌物（子宮乳，至少延續至第 12 週；黃體期缺陷與腺體 PR 未下調易致早期流產，<b>Box 13.1</b>），胚胎體積增長有限但專注於複雜組織形態分化。</li>
  <li><b>胚外膜分化（Figs 13.1–13.2）</b>：<ul>
    <li><b>卵黃囊（絨毛卵黃囊胎盤）</b>：下胚層＋胚外中胚層（最初造血處）；在有袋類維持全孕期、兔／鼠維持重要運輸角色、人類僅過渡並隨後萎縮。</li>
    <li><b>尿囊絨毛膜胎盤（Chorioallantoic）</b>：胚胎後腸內胚層突出形成尿囊（allantois）與臍血管中胚層貼合絨毛膜。<b>羊膜（Amnion）</b>隨妊娠擴大並逐步消滅胚外體腔。</li>
  </ul></li>
  <li><b>羊子葉胎盤（Placentome，Box 13.2, Fig 13.3）</b>：母體約 80–90 個子宮阜（caruncle）與胎兒絨毛葉（cotyledon）指狀嵌合，呈反向微血管流向提升交換效率。</li>
</ul>
<h3>13-2 絨毛外滋養層（EVT）、螺旋動脈轉換與低氧防護（Figs 13.4–13.6, Box 13.3）</h3>
<ul>
  <li><b>人胎盤單位</b>：熟胎盤如直徑 15–20 cm、厚 3 cm 之圓盤，由約 200 個由幹絨毛→中間→終末絨毛微血管叢組成的胎兒小葉（開窗酒杯狀 lobules）構成；母血以 <b>4–10 mmHg</b>、<b>0.1–10 ml/s</b>（滯留 ~15 秒）緩流浸潤絨毛間隙（與經胎肌層受交感神經支配的動脈相反，轉換後螺旋動脈失去血管收縮反應）。</li>
  <li><b>為什麼第 10–12 週前要刻意「塞住」母血？（Figs 13.6, Box 13.3）</b>：<ul>
    <li><b>血管內 EVT（Endovascular EVT）</b> 兩階段任務：① 將母體螺旋動脈破壞平滑肌與內皮，重塑為「低壓高容弛緩導管」（<b>Conversion</b>）；② 第一孕期暫時<b>部分阻塞動脈開口（trophoblastic plugs）</b>，使絨毛間隙僅滲入無紅血球之血漿與腺體分泌液，維持 <b>2–3% 低氧環境</b>（穩定轉錄因子 <b>HIF1α</b>，防止粒線體產生<b>活性氧類 ROS</b> 攻擊正值關鍵分化期的胚胎而致畸或流產！）。</li>
    <li>第 10–12 週起塞子消退，全面開啟高效<b>血液滋養（Haemotrophic）</b>驅動第二、三孕期高速長肉！重塑失敗將引致<b>子癇前症（pre-eclampsia）</b>與子宮內胎兒生長遲滯（IUGR）。</li>
  </ul></li>
</ul>
<h3>13-3 胎盤內分泌獨立與母胎盤類固醇協作單位（Figs 13.7–13.8, Tables 13.1–13.3）</h3>
<ul>
  <li><b>人類第 5–6 週黃體－胎盤接管</b>：切除卵巢於人約第 40 天（羊 D55、馬 D150–200、豬/牛/兔/山羊需至足月，<b>Table 13.1</b>）後即不再導致流產；妊娠 6–9 週血漿 P₄ 小平台伴隨黃體指標 17α-OHP 下降反映交棒完成。</li>
  <li><b>胎盤助孕素（&gt;200 mg/day）</b>：完全由合胞滋養層以<b>母體膽固醇（不能用醋酸）</b>自主合成，不需要胎兒參與（葡萄胎／絨毛膜癌無胎兒仍大量分泌 P₄）；雌激素促肝產 3 倍<b>皮質類固醇結合球蛋白（transcortin）</b>綁定大量 P₄ 與皮質醇。</li>
  <li><b>母－胎－胎盤「雌三醇（E₃）」雙向工廠（Fig 13.8）</b>：<ul>
    <li>胎盤有<b>芳香化酶（aromatase）</b>與去硫酸酶但缺 C17–20 裂解酶，無法從 P₄ 自製雄激素；<b>胎兒腎上腺（胎兒帶）</b>製造大量 <b>DHA-S</b> 但無法芳香化；<b>胎兒肝臟</b>加作 <b>16α-羥基化</b>產生 <b>16α-OH-DHA-S</b> 回流胎盤，經 <b>X-連鎖胎盤硫酸酯酶</b>去硫酸並芳香化為人孕期最豐富的雌激素——<b>雌三醇（Oestriol, E₃）</b>！</li>
    <li><b>硫酸化保護機制</b>：胎兒幾乎將所有類固醇「硫酸化（水溶且無生物活性）」再送出，由胎盤「去硫酸化」，保護女胎免受雄激素男性化卻能維持母體極高類固醇濃度！無腦兒因胎兒腎上腺萎縮，E<sub>3</sub> 暴跌，故 16α-羥基類固醇可反映胎兒安危。</li>
  </ul></li>
  <li><b>蛋白激素接力與物種差異（Boxes 13.4–13.5）</b>：<b>hCG</b> 8 週後下降（其中高糖基化型促 EVT 轉換螺旋動脈）；<b>hPL</b> 與 <b>hGH-V</b>（壓抑母體垂體 GH、誘導 IGF1 重新分配養分給胎兒）隨後攀升；脫膜分泌大量 <b>泌乳素（PRL）</b> 入羊水調節水電解質。馬 D40–120 由子宮內膜杯分泌 <b>eCG (PMSG)</b> 誘導母體次級排卵／次級黃體，中後期轉靠肥大<b>胎兒性腺</b>產 DHA-S 製造馬特異雌激素 <b>Equilin / Equilenin</b>！</li>
</ul>`,
  quiz: [
    { q: '人類妊娠前 10–12 週為何胎盤結構早已具備雛形，卻刻意由血管內滋養層細胞（endovascular EVT）在螺旋動脈開口形成栓塞，使絨毛間隙維持在僅 2–3% 的低氧狀態？（p.232–235, Box 13.3）', o: ['因為粒線體高氧呼吸產生的活性氧（ROS）對正處於複雜器官分化與形態發生的第一孕期胚胎具極大氧化損傷與致畸風險，故演化犧牲早期生長速度以低氧 HIF1α 穩定與組織滋養保護胚胎，待第 10–12 週才全面開放母血灌流', '因為胚胎紅血球在 12 週前遇氧就會立即爆炸溶血', '因為母體心臟在第 12 週前完全無法泵血到子宮', '因為胎盤在 12 週前還不具備合成 P₄ 的膽固醇受體'], a: 0, e: 'Ch13 p.232–235 & Box 13.3：胚胎分化優先於純生長；若過早失去塞子導致早期氧化壓力會引發流產，若過晚或未成功重塑轉換（conversion failure）則引起子癇前症與胎兒生長遲滯（IUGR）。' },
    { q: '比較「組織滋養（Histiotrophic）」與「血液滋養（Haemotrophic）」對人類妊娠的時期分工與病理關聯（Box 13.1, p.228–229），下列何者正確？', o: ['前 12 週主要由子宮內膜腺體（「子宮乳」）與鄰近脫膜崩解物提供糖蛋白、生長因子與微量營養素；若腺體上皮 PR 未如期下調使分泌受抑（常見於黃體期缺陷），極易導致第一孕期早期流產', '組織滋養只在懷孕最後兩週出現，靠直接喝羊水維持', '人類在整個孕期 40 週完全沒有組織滋養階段，從受精第 1 天即直接泡在母血中', '人類絨毛卵黃囊胎盤一直取代尿囊絨毛膜胎盤工作到 40 週分娩'], a: 0, e: 'Ch13 p.228 & Box 13.1：除子宮乳至少持續供養 12 週外，脫膜 PRL 與早期 hPL/hCG 亦協助維持腺體分泌，確保器官分化完成才切換為血液滋養。' },
    { q: '為什麼「轉換後（Converted）」的母體胎盤螺旋動脈呈現低壓、高容積、不對血管收縮藥物起反應的特徵，反而不易把脆弱的胎兒絨毛沖壞或壓垮？（p.232–236, Fig 13.6）', o: ['因為端內血管滋養層（endovascular EVT）入侵並破壞了螺旋動脈的平滑肌與血管內皮，擴大終末管徑；加上交感神經只分布到子宮肌層動脈而不到螺旋動脈，使母血以 4–10 mmHg、0.1–10 ml/s 緩慢均勻浸潤過絨毛酒杯小葉', '因為螺旋動脈內部全部鈣化成骨管', '因為人類胎兒心臟產生的血壓高於母親主動脈兩倍', '因為所有螺旋動脈都與母體肺動脈直接相通'], a: 0, e: 'Ch13 p.232–236：正因為絨毛間隙母血壓極低（4–10 mmHg）才不至於把更低壓的胎兒終末絨毛微血管壓扁；若母親吸菸或長期高壓引起子宮肌層交感收縮則會減少灌流導致低出生體重兒。' },
    { q: '在人類孕期類固醇監測中，為什麼測量孕婦尿液「孕二醇（pregnanediol）」或血中「孕酮（P₄）」幾乎無法準確警告「胎兒本體是否瀕臨窘迫」，而測量「雌三醇（Oestriol, E₃）」卻極具診斷價值？（p.238–240, Fig 13.8）', o: ['胎盤合成 P₄ 僅需母體膽固醇，完全不需要胎兒參與（無胎兒的葡萄胎照樣分泌 P₄）；反之 E₃ 的芳香化前驅物 16α-OH-DHA-S 只能來自「活的胎兒腎上腺（產 DHA-S）＋胎兒肝臟（16α-羥基化）」協作，因此 E₃ 急降直接反映胎兒－胎盤單位危急', '因為胎盤本身完全無法製造助孕素', '因為 E₃ 完全由母體卵巢單獨分泌不經胎兒或胎盤', '因為孕婦在孕期體內所有 E₃ 都被轉成膽固醇'], a: 0, e: 'Ch13 p.238–240 & Fig 13.8：胎兒無腦症（anencephaly，腦垂腺－腎上腺軸缺損）時 E₃ 相對於 E₁+E₂ 的比例大幅崩跌；而孕母血中的 E₁/E₂ 仍有 50–60% 可改採母體腎上腺 DHA-S 合成故較不明顯！' },
    { q: '為什麼在妊娠期間「胎兒會為類固醇加上硫酸根（conjugation）」，而「胎盤卻積極為類固醇去硫酸（deconjugation）」？（p.239–240, Fig 13.8）', o: ['硫酸化後的類固醇呈水溶性且無生物活性，可保護發育中胎兒組織（如女胎外生殖器）免於過早暴露在雄激素或活性類固醇的誤導下；而胎盤經硫酸酯酶（X-連鎖基因）將其活化回自由雌激素釋入母體維持高濃度需求', '胎兒加上硫酸根是為了直接溶化母親骨盆骨頭', 'X-連鎖胎盤硫酸酯酶缺乏症會使胎兒全部變性為男性', '硫酸酯化是讓類固醇無法溶於水的唯一方法'], a: 0, e: 'Ch13 p.239–240 & Fig 13.8 legend：X-連鎖胎盤硫酸酯酶缺乏症會使 C₁₉ 芳香化製造雌激素嚴重受阻而出現母體雌激素缺乏。' },
    { q: '根據 Table 13.1 與 Box 13.5 比較不同物種母體卵巢與胎盤接管妊娠維持能力的差異，下列敘述何者正確？', o: ['人類（約第 40 天）、恆河猴（21 天）、綿羊（55 天）與馬（150–200 天）在該時點後切除雙側卵巢妊娠仍可繼續；但牛、豬、山羊與兔於孕期任何階段切除卵巢都會流產（Group C）', '在馬（mare）懷孕中期合成大量 Equilin 與 Equilenin 所需的 C₁₉ DHA-S 來自「肥大的胎兒性腺間質組織」而非胎兒腎上腺，且 D40–120 由內膜杯分泌 eCG 促母體排卵形成次級黃體', '上述選項 A 與 B 兩者皆完全正確', '羊胎盤和人類胎盤一樣，永遠無法把助孕素轉化為雌激素'], a: 2, e: 'Ch13 Table 13.1 & Box 13.5：A 與 B 均正確！而且要特別注意最後一選項的陷阱：羊胎盤與人不同，羊在臨近分娩時「能夠」由胎兒皮質醇誘導胎盤 17α-hydroxylase 把 P₄ 直接轉為雌激素啟動分娩（見 Ch17）！' },
    { q: '關於懷孕中期以後登場的胎盤蛋白荷爾蒙——胎盤泌乳素（hPL）、胎盤生長激素變異體（hGH-V）與脫膜泌乳素（decidual PRL），其生理分工何者正確？（p.240–241）', o: ['hGH-V（由胎盤製造、不會進入胎兒血中）會負回饋壓抑母體垂體 hGH 並誘導胎盤 IGF1 把養分重新分配給胎兒；缺 hGH-V 常伴隨胎兒生長遲滯；脫膜產生的大量 PRL 主要排入羊水中調節胎兒水與電解質平衡', 'hCG 在第 12 週之後持續指數上升並在分娩當天達到最高峰以維持黃體', '胎盤只製造 hCG 與 P₄，絕對不分泌任何下視丘／腦垂體類胜肽如 GnRH 或 CRH', '人類胎盤無法製造任何細胞激素'], a: 0, e: 'Ch13 p.240–241：胎盤宛如「迷你有機體（mini-organism）」，還能合成 GnRH、CRH、ACTH、催產素、TGFβ、IGF1/2、Leptin 等豐富訊號分子。' },
    { q: '在人類孕期中，妊娠血漿皮質醇（Cortisol）濃度為何會上升並可由給非孕女性注射雌激素來重現？（p.240）', o: ['主要因為高濃度雌激素強烈刺激肝臟合成皮質類固醇結合球蛋白（transcortin，從 3.5 升至 10 mg/100 ml），綁住大量皮質醇與助孕素（並略減游離皮質醇代謝）', '因為雌激素把母親肝臟完全破壞停止排除皮質醇', '因為胎兒頭骨直接壓迫母親腎上腺造成腫瘤', '因為人類孕婦體內完全沒有助孕素只能用皮質醇替代'], a: 0, e: 'Ch13 p.240：Transcortin 增加約三倍同時提升血漿結合型 P₄ 與 cortisol 總濃度（與 Table 1.7 一致）。' }
  ]
};
</script>
