  summary: `
<h3>10-1 輸出小管與副睪成熟（Figs 10.1–10.2, Table 10.1）</h3>
<ul>
  <li><b>輸出小管（Vasa efferentia，依物種約 10–20 條）</b>：連接睪丸網（rete testis，缺完整血睪障壁）與副睪頭；僅約 1 天通路上卻以依賴<b>雌激素（ERα）</b>的微胞飲吸收 <b>&gt;90%</b> 賽托利細胞液。ERα 基因剔除鼠或結紮輸出小管會導致生精小管液體回堵爆腫與壓力性無精症（「遺傳性結紮」）。</li>
  <li><b>副睪成熟（5–11 天，Table 10.1）</b>：分為頭（caput）、體（corpus）、尾（cauda），組織學上另分起始段、中段與終段（含高密度平滑肌與貯精功能）。雄激素主要由睪丸液與淋巴中的 <b>ABP-睪固酮（30–60 ng/ml）</b>進入，經 <b>5α-還原酶轉為 DHT</b> 維持。</li>

<h3>10-2 精漿、交配與勃起血液動力學（Tables 10.2, Box 10.1, Figs 10.3–10.5）</h3>
<ul>

  <li><b>Masters &amp; Johnson EPOR 模型</b>：興奮期（E）→ 高原期（P）→ 高潮期（O）→ 消退期（R，男性具絕對不反應期）。</li>
  <li><b>勃起分子開關（Box 10.1）</b>：骨盆副交感神經＋剪應力活化 <b>nNOS → eNOS</b> 產生 <b>NO</b> → 平滑肌 <b>cGMP</b> 上升 → 海綿體動脈與小樑平滑肌舒張、<b>動靜脈分流關閉</b>轉向海綿體竇、充血腫脹壓迫<b>白膜下靜脈叢（sub-tunical venous plexus）</b>減少流出 → 轉為高容積高壓系統。<b>尿道海綿體</b>壓力較低以免壓扁尿道。PDE5 抑制劑（Sildenafil 等）透過保護 cGMP 加強勃起。</li>

  <li><b>女性同源反應（Fig 10.5）</b>：陰蒂海綿體勃起、陰道壁滲液潤滑（非分泌上皮）與巴氏腺黏液、子宮上提產生中段陰道<b>帳篷效應（tenting effect）</b>。</li>

<h3>10-3 配子於雌性生殖道之雙向運輸（Table 10.3, Fig 10.6）</h3>
<ul>

  <li><b>卵子運輸</b>：輸卵管傘（fimbria）掃集卵丘卵團，由纖毛與 <b>Cajal 間質細胞（ICC）節律器</b>調控平滑肌蠕動送至 AIJ 會合（人卵受精壽命僅 <b>6–24 小時</b>）。</li>
</ul>`,
  quiz: [
    { q: '為什麼外科結紮「輸出小管（vasa efferentia）」或小鼠剔除雌激素受體 ERα 會造成睪丸生精小管漲大並導致壓力性無精症，但外科「結紮輸精管（vasectomy）」卻不會？（p.176–177）', o: ['輸出小管負責以依賴 ERα 的機制吸收超過 90% 的賽托利細胞分泌液；結紮輸精管前這些液體早已吸收完畢', '輸精管比輸出小管更容易再通', '輸出小管直接製造睪固酮使小管腫脹', '賽托利細胞在結紮輸精管後立即停止存在'], a: 0, e: 'Ch10 p.176–177：輸出小管微胞飲吸收 &gt;90% 液體且高度依賴睪丸內高濃度 E₂/ERα，故 ERα KO 鼠稱為「遺傳性結紮」。' },
    { q: '刺激副睪功能與精子成熟的雄激素主要來自何處？（p.177）', o: ['僅靠體循環低濃度游離睪固酮從動脈供應', '主要隨睪丸液與淋巴經輸出小管帶入副睪（結合於 ABP 達 30–60 ng/ml），並由副睪 5α-還原酶轉為更強效的 DHT', '由副睪本身從膽固醇從頭合成', '由前列腺逆流輸入'], a: 1, e: 'Ch10 p.177：結紮輸出小管阻斷睪丸液/ABP 輸入會導致副睪明顯退化，證明局部輸送路徑的重要性。' },
    { q: '關於精子在副睪成熟（5–11 天）與精漿成分的敘述，下列何者錯誤？（Tables 10.1–10.2, p.177–182）', o: ['精子濃度於副睪濃縮約 100 倍（達 50×10<sup>8</sup>/ml），尾巴外緻密纖維雙硫鍵增加、細胞質滴脫落', 'EPPIN 由賽托利細胞與副睪分泌並包被精子，可防蛋白酶傷害與過早獲能', '人類健康精液為必需，缺少儲精囊或前列腺精漿的副睪尾精子絕對無法在試管中受精', '人類分節射精早段含前列腺酸性磷酸酶、中段含精子、晚段含儲精囊果糖'], a: 2, e: 'Ch10 p.178：「Seminal plasma is not essential for effective sperm function」，直接取自輸精管/副睪尾的精子即可體外受精，精漿主要提供體內運輸載體、緩衝陰道酸與抗氧化保護。' },
    { q: '關於陰莖勃起（erection）的血液動力學與神經藥理調控，下列何者正確？（Box 10.1, p.180–181）', o: ['交感神經下腹神經促進勃起，副交感骨盆神經使其消退', 'nNOS（啟動）與剪應力誘發的 eNOS（維持）產生 NO 使 cGMP 上升、動脈與小樑平滑肌舒張、AV 分流轉向海綿體竇並壓迫白膜下靜脈叢阻止回流', '尿道海綿體壓力必須與陰莖海綿體一樣高且硬', 'Sildenafil（威而鋼）透過抑制一氧化氮合成酶 NOS 治療勃起障礙'], a: 1, e: 'Ch10 Box 10.1 & p.181：Sildenafil/Tadalafil 為 PDE5 抑制劑（阻斷 cGMP 分解而非抑制 NOS）；尿道海綿體腫脹壓力較低以防壓閉尿道影響射精。' },
    { q: '服用拮抗 α-腎上腺素受體的高血壓藥物時，男性患者最可能出現哪種性功能現象，與「逆行射精」有何不同？（p.181–182）', o: ['發生「乾性高潮（dry orgasm）」：能正常勃起但交感神經介導的輸精管／儲精囊／前列腺「排精（emission）」受阻（且排精尚需 ATP 共同傳遞）；而逆行射精是膀胱頸尿道括約肌未閉合使精液逆流入膀胱', '完全喪失所有勃起能力但射精正常', '精液量暴增至 500 ml', '陰莖海綿體白膜自動破裂'], a: 0, e: 'Ch10 p.181–182：emission 由下腹交感神經（NA + ATP）主導；膀胱頸括約肌失效才導致精液逆流入膀胱。' },
    { q: '比較不同動物的交配精液沉積部位與體外／體內存活時間（Table 10.3, p.184–185），下列配對何者正確？', o: ['豬、馬直接沉積於子宮頸或子宮內；馬精子在雌道內可維持受精活力長達 75–120 小時（人精子約 28–48 h、人卵約 6–24 h）', '人類精子直接射入輸卵管壺腹部，完全不會漏出陰道', '小鼠精子在陰道存活 120 小時，卵子可維持 72 小時不老化', '所有哺乳動物的精液凝固塊皆呈現鈣質硬塊（calcareous）'], a: 0, e: 'Ch10 p.184–185, Table 10.3：人/牛/羊射於陰道及子宮頸口；豬/犬/馬/小鼠/大鼠直接射入子宮頸/子宮。小鼠凝塊為鈣質，人/豬/馬為凝膠狀且人於 20–60 分鐘液化。' },
    { q: '為何缺乏表面醣蛋白 ADAM1 的雄性基因剔除小鼠精子在顯微鏡下仍能正常游動，卻在體內無法到達輸卵管？同時正常精子進入輸卵管後的貯存處為何？（p.185）', o: ['雖具泳動能力，但必須透過精子表面 ADAM1 與雌性組織交互作用才能通過子宮輸卵管接合部（UTJ）；通過後暫時結合在輸卵管峽部（isthmus）上皮靜待排卵', 'ADAM1 是精子鞭毛 ATP 合成酶', '正常精子會永遠停留在子宮頸隱窩直到著床', '精子直接由輸卵管傘側進入腹腔受精'], a: 0, e: 'Ch10 p.185：UTJ 扮演間歇括約肌篩選器；峽部則作為排卵前精子貯庫並穩定其膜狀態，待排卵期化學趨化信號釋放後再游至壺腹—峽部交界處。' },
    { q: '卵子排入腹腔後進入輸卵管壺腹部受精的運輸機制，下列何者為核心驅動力？（p.185）', o: ['卵子自己長出鞭毛高速游動', '靠輸卵管傘（fimbria）主動拾取卵丘卵團，並結合上皮纖毛擺動與 Cajal 間質細胞（ICC）節律調控的平滑肌蠕動推進', '靠陰道負壓把卵子吸下子宮頸', '靠排卵時黃體噴出的機械射流'], a: 1, e: 'Ch10 p.185：缺乏卵丘細胞、纖毛異常或 ICC 節律受抑皆會破壞輸卵管運卵並可能造成胚胎滯留輸卵管（tube locking）。' }
  ]
};
