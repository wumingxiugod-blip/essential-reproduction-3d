<script>
window.CHAPTER = {
  no: 17, zh: '分娩機制、子宮頸重塑與計時開關', en: 'Giving Birth', color: '#f97316',
  summary: `
<h3>17-1 分娩三產程、縮短滯留與子宮頸重塑（Figs 17.1–17.4）</h3>
<ul>
  <li><b>正常孕期中位數 280 天（40 週，LMP 起算）</b>：37–42 週為足月（Term）；&lt; 259 天為早產（Preterm，7–8% 單胎但 &gt;50% 多胎）；&gt; 294 天為過期妊娠（Post-term）。人類產道口徑與胎頭緊密吻合（對比寬裕的黑猩猩骨盆，Fig 17.1），分娩是母親與嬰兒高選擇壓關卡。</li>
  <li><b>三產程與「縮短滯留（Brachystasis）」</b>：<ul>
    <li><b>第一產程</b>（初產婦全程 ~14 h、經產婦 ~8 h 佔最久）：規則宮縮（宮壓 <b>50–100 mmHg</b>，間期 ~10 mmHg）至子宮頸全開。平滑肌發生 <b>Brachystasis（每次收縮後放鬆不回原長）</b>使上段子宮底肌層變短變厚，將被動不收縮的子宮下段與子宮頸向上拉平形成<b>生理性回縮環（physiological retraction ring）</b>並合為連續產道。</li>
    <li><b>第二產程（通常 &lt;1 h）</b>：經銜接俯屈→內轉→仰伸→外轉分娩出胎兒（Fig 17.3）。</li>
    <li><b>第三產程</b>：胎盤剝離與排出（人肌層纖維交錯纏繞血管利於產後止血，p.288）。</li>
  </ul></li>
  <li><b>子宮頸重塑四期（Cervical remodelling，p.287–288）</b>：軟化（Softening，第一孕期即漸展開，糖胺聚醣 GAGs ↑）→ <b>成熟（Ripening）</b>（似發炎反應，單核球浸潤、<b>IL-6/IL-8 ↑</b>、高分子量<b>玻尿酸 HA ↑</b>，由 <b>PGE₂/PGF₂α、NO (iNOS)</b> 及<b>鬆弛素 Relaxin（Box 17.2，黃體大黃體細胞為主）</b>推動）→ <b>擴張（Dilation）</b>（<b>玻尿酸酶 ↑</b>把高 MW HA 分解為低 MW HA 增吸水性＋金屬蛋白酶 MMPs 分解膠原使極具伸展性）→ 產後修復。</li>
</ul>
<h3>17-2 類固醇、前列腺素、催產素與 Ferguson 正回饋反射（Fig 17.5）</h3>
<ul>
  <li><b>抑制 vs 啟動平滑肌合胞體</b>：人子宮肌細胞孕期由 50 μm 肥大至 500 μm，靠間隙連接（gap junctions / <b>connexin</b>）連動。週期收縮須靠 <b>PGI₂</b> 維持間歇舒張（與放鬆子宮下段！）以防持續高壓悶死胎兒。</li>
  <li><b>E<sub>2</sub>:P<sub>4</sub> 比值雙重開關</b>：<ul>
    <li><b>磷脂酶 A₂（PLA₂）</b>：<b>P<sub>4</sub></b> 穩定胞膜抑制 PLA₂（抑產 PG）；<b>E<sub>2</sub></b> 活化 PLA₂ 增加花生四烯酸產 <b>PGF₂α 與 PGE₂</b>（兩者降低動作電位閾值並促 Ca<sup>2+</sup> 流入）。</li>
    <li><b>催產素受體（OTR）</b>：P<sub>4</sub> 減少 OTR；E<sub>2</sub> ＋（低 P<sub>4</sub> 時之）子宮撐張大幅增加 OTR 與 connexin 並提高脫膜自身催產素 mRNA（選擇性剖腹產脫膜催產素低正常自然產 4 倍！）。</li>
  </ul></li>
  <li><b>Ferguson 正回饋反射（Fig 17.5）</b>：子宮頸與陰道撐張 → 脊髓前外側柱 → 腦幹與內側前腦束 → 下視丘<b>視室旁核（PVN）與視上核（SON）</b>脈衝式釋放<b>催產素</b>入垂體後葉與血中 → 強宮縮更猛烈撐開子宮頸 → 正回饋直到分娩完成！</li>
</ul>
<h3>17-3 綿羊胎兒皮質醇時鐘 vs 人類胎盤 CRH 與功能性退孕酮（Fig 17.6, Box 17.3）</h3>
<ul>
  <li><b>綿羊模式（胎兒決定出生時刻，Fig 17.6, Box 17.3）</b>：胎兒 PVN <b>CRH</b> → 胎垂體 ACTH（孕末 15–20 天）→ <b>胎兒皮質醇</b>暴衝 → 刺激胎盤 <b>PGE₂</b> → 誘導胎盤 <b>17α-羥化酶與 C17–20 裂解酶</b>，把胎盤正在合成的 <b>P<sub>4</sub> 直接改道轉成雌激素</b> → 母血 P<sub>4</sub> 崩跌、E<sub>2</sub>:P<sub>4</sub> 大漲引動產程！（山羊則因依賴黃體，皮質醇誘胎盤芳化 DHEA 生 E<sub>2</sub> → PGF₂α → 黃體溶萎）。</li>
  <li><b>人類與大猿的特殊謎題（p.291–292）</b>：<ul>
    <li>孕母血漿 <b>P<sub>4</sub> 在臨產前並不下跌</b>，全身 E<sub>2</sub>:P<sub>4</sub> 比也沒有固定上升；注入 ACTH 或皮質醇並不能可靠誘產人類分娩。</li>
    <li>唯獨人與大猿在第三孕期呈現指數飆升的 <b>「胎盤 CRH」</b>（且血液結合蛋白 CRH-BP 下滑使自由 CRH 大增，促胎兒腎上腺區產 <b>DHEAS</b> 與皮質醇，皮質醇又反促胎盤 CRH 形成正回饋），其上升速率與早／過期產高度相關！</li>
    <li><b>功能性助孕素撤退（Functional progesterone withdrawal）</b>：雖然血 P<sub>4</sub> 不降，但分娩時子宮肌層內「活化型 <b>PR-B</b> 相對顯性抑制型 <b>PR-A/PR-C</b> 比例下降」、<b>5β-還原酶下降</b>（減產舒張代謝物 5β-dihydroprogesterone）、共活化蛋白減少 → 解除對 <b>ERα</b> 的壓制，使子宮組織在「局部受體層面看見高 E<sub>2</sub>/低 P<sub>4</sub>」！</li>
  </ul></li>
  <li><b>臨床催產（Bishop score &gt; 6）</b>：陰道給 PGE₂ 促成熟、催產素點滴、或 <b>RU486</b> 拮抗 PR。</li>
</ul>`,
  quiz: [
    { q: '為什麼人類在「第一產程」規律強宮縮（宮腔壓達 50–100 mmHg）之後，即使進入短暫間歇鬆弛期，子宮腔總容積卻能一步步縮小、上部肌層越變越厚並將下部推平拉出產道？這現象專有名詞為何？（p.285）', o: ['稱為「縮短滯留（Brachystasis）」：上部子宮平滑肌每次收縮後放鬆並不恢復原本長度，藉此逐步向上回縮「被動不收縮的下段與子宮頸」，產生可觸診之生理性回縮環', '稱為緊實化（Compaction）', '稱為子宮內膜螺旋動脈轉換', '因為平滑肌完全變成永久僵直的骨骼肌永不再放鬆'], a: 0, e: 'Ch17 p.285：下段肌層在產程中保持被動、不主動收縮，且由於子宮頸緊附著於骨盆韌帶筋膜拉住下方，最終拉平並擴張成為連續產道！' },
    { q: '分娩時子宮平滑肌細胞之間的電氣連動與週期交替節律中，三種重要分子 <b>PGF₂α / Oxytocin / PGI₂</b> 各扮演什麼關鍵分工？（p.289）', o: ['PGF₂α 與催產素降低動作電位閾值、提高 Ca²⁺ 並增加 Connexin 間隙連接促同步強縮；相對地，<b>PGI₂（前列環素）透過不同受體「舒張」肌層（尤其鬆弛子宮下段並在兩次宮縮間保證胎盤血流復原不窒息胎兒）</b>', 'PGE₂ 與 PGF₂α 專門阻止一切宮縮以延長孕期', 'PGI₂ 是所有動物催產強度最強的收縮劑', '催產素只在父親精漿中影響胎兒心率'], a: 0, e: 'Ch17 p.289：如果宮縮持續不斷而非週期性間歇，會壓死胎盤供血導致胎兒窒息，因此 PGI₂ 與低壓間歇同樣重要！' },
    { q: '子宮頸從懷孕期間堅硬緊閉到分娩時高度順應擴張的「成熟（ripening）」與「擴張（dilation）」階段，內部細胞外間質（玻尿酸 HA 等）發生了什麼關鍵生物物理變化？（p.287–288）', o: ['成熟期呈類發炎反應（單核球、IL-6/IL-8 ↑、PGE₂/NO/Relaxin ↑）並製造高量「高分子量玻尿酸」；進入擴張期時「玻尿酸酶（hyaluronidase）」與 MMPs 活性上升，將高 MW HA 切為低 MW 片段大幅提高吸水性與黏彈性並打散膠原纖維束', '成熟期玻尿酸完全消失且大量沉積鈣質使子宮頸變成硬骨', '擴張是由胚胎伸手撕開韌帶達成的', '高濃度助孕素 P₄ 在分娩時驟增 10 倍使子宮頸立刻溶解'], a: 0, e: 'Ch17 p.288：陰道給 PGE₂ 或抑制 iNOS(NO) 的動物實驗已證實 PG 與 NO 參與促成熟與膠原分散。' },
    { q: '「Ferguson 反射（Ferguson reflex，Fig 17.5）」的神經內分泌正回饋路徑是如何建構的？為什麼同時還需要高雌激素低孕酮或子宮撐張協同？（p.289–290）', o: ['子宮頸與陰道擴張刺激感覺神經 → 脊髓前外側柱 → 腦幹／內側前腦束 → 下視丘 PVN 與 SON 大細胞神經元從垂體後葉釋放「催產素」；同時高 E₂:P₄（與低 P₄ 下的子宮撐張）大增肌層「催產素受體」與脫膜催產素合成，形成不斷自我加碼的正回饋循環', '胎頭壓迫膀胱直接把腎臟的催產素擠入血管', 'Ferguson 反射只作用於垂體前葉抑制泌乳素', '子宮撐張只能在極高助孕素存在下才誘導前列腺素受體'], a: 0, e: 'Ch17 p.290, Fig 17.5 & p.293：注意擇期剖腹產因缺少急性子宮頸擴張與劇烈宮縮，產婦脫膜內的催產素含量比自然產低 4 倍！' },
    { q: '綿羊（與多數動物）是透過胎兒下視丘—垂體—腎上腺軸精密定時分娩的典型（Fig 17.6, Box 17.3）：請問胎兒腎上腺的「皮質醇（Cortisol）」如何把原本穩如泰山的「胎盤助孕素」一瞬間變不見？（p.291–292）', o: ['胎兒皮質醇促進胎盤滋養層製造 PGE₂，進而強力激活胎盤「17α-羥化酶與 C17–C20 裂解酶」，把原本產出的助孕素全部截流改道合成為雌激素 → 造成母血助孕素暴跌與 E₂:P₄ 比例劇升！', '胎兒皮質醇直接毒死綿羊媽媽的腦垂體與下視丘', '羊跟人一樣，在分娩當天血中助孕素毫無下降', '綿羊胎兒皮質醇只會關閉羊膜水流'], a: 0, e: 'Ch17 Box 17.3 & Fig 17.6：注意在「山羊」因孕期 P₄ 來自黃體而非胎盤，胎兒皮質醇改為誘使胎盤把 DHEA 芳香化為 E₂ → 觸發子宮 PGF₂α 造成黃體溶萎來達成 P₄ 崩跌！' },
    { q: '為何不能將綿羊「母血 P₄ 暴跌與 E₂:P₄ 驟升觸發分娩」的機制直接套用至人類女性？人類孕末最特別的「胎盤定時指標」與「局部子宮退孕酮機制」為何？（p.291–292）', o: ['人類分娩前母血 P₄ 並不顯著下降！但人與大猿特有的「胎盤 CRH」會在第三孕期呈指數飆升（與早／過期產同步）並減產 CRH-BP；且子宮肌層出現「功能性助孕素撤退」——活化型 PR-B 相對抑制型 PR-A/C 比例下降、5β-還原酶下降，解除對 ERα 的抑制使子宮「局部感覺不到 P₄」', '人類胎兒根本沒有腎上腺', '人類分娩是由孕母卵巢在第 40 週重新排卵啟動的', '人類胎盤會主動吸收空氣中的催產素維持妊娠'], a: 0, e: 'Ch17 p.291–292：反孕酮藥物（RU486）仍能誘發人類分娩正證明「P₄ 訊息在子宮組織層面的效力喪失」才是關鍵開關！' },
    { q: '關於臨床「鬆弛素（Relaxin，Box 17.2）」在人類懷孕與早產中的來源與可能臨床風險，下列敘述何者正確？', o: ['人類（及豬/牛/羊/鼠）血中鬆弛素主要來自「妊娠黃體大黃體細胞」，7–10 週即可測得並於 38–42 週達峰；人工排卵刺激造成多顆妊娠黃體時會出現「高鬆弛素血症（hyper-relaxinaemia）」，第 30 週高鬆弛素與早產風險增加有關', '人類鬆弛素 100% 由胎兒大腦皮質製造並只在產後才上升', '鬆弛素是結構與膽固醇完全相同的類固醇', '人類子宮頸完全不表現任何鬆弛素受體'], a: 0, e: 'Ch17 Box 17.2：Relaxin 屬胰島素家族雙鏈二硫鍵胜肽激素；天竺鼠主產於子宮、兔馬主產於胎盤，人類/豬/牛/羊/鼠則主產於妊娠黃體。' },
    { q: '關於近年英美已開發國家孕產婦死亡率（MMR，Box 17.1）出現微幅回升，以及第 17 章討論「過多胎心音監測」或「重複注射產前合成皮質醇」之醫療反思考點，下列何者符合課文觀點？（p.284–293）', o: ['已開發國家的間接醫源／內科／精神死因已超越直接產科死因，可能與晚育、輔助生殖多胎與剖腹產率攀升（英國 1980 年 9% → 2009 年 25%）有關；常規過度胎兒電子監測並未必然優於間歇聽診反易過度轉為剖腹產；早產高風險僅建議單劑合成類固醇而非反覆多劑', '剖腹產率提升到 100% 絕對毫無任何生理或母乳／新生兒呼吸適應風險', '反覆給懷孕婦女打 10 次地塞米松毫無副作用且對腦部完全安全', '目前在開發中地區 99% 的產婦死亡全因雙胞胎過多'], a: 0, e: 'Ch17 Box 17.1 & p.287, 293：這幾點展現了作者對產科干預效益與風險平衡的嚴謹實證立場！' }
  ]
};
