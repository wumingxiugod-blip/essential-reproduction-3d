<script>
window.CHAPTER = {
  no: 18, zh: '泌乳啟動、雙神經內分泌反射與乳汁免疫', en: 'Lactation', color: '#e8b84b',
  summary: `
<h3>18-1 乳腺解剖、妊娠備乳與產後 P₄ 煞車解除（Figs 18.1–18.5, Table 18.1, Box 18.2）</h3>
<ul>
  <li><b>乳腺構造（Figs 18.1, 18.3–18.4）</b>：人類每側乳腺含 <b>15–20 葉（lobes）</b>，各由獨立的輸乳竇（lactiferous sinus）匯集並分別開口於乳頭；腺泡由單層分泌上皮細胞構成（依充盈度呈立方→扁平），細胞與基底膜之間包覆能收縮的<b>肌上皮細胞籃（myoepithelial cells）</b>。蒙哥馬利腺（Montgomery glands）分泌油脂潤滑乳暈。</li>
  <li><b>物種差異（Fig 18.2）</b>：人類 15–20 葉各自開口；大鼠單一乳管開口；反芻類（牛羊）擁有多層彙總的大<b>乳腺池（gland cistern）→ 乳頭池（teat cistern）→ 乳頭管</b>（豬最多可達 18 個／9 對乳房）。</li>
  <li><b>發乳開關（Lactogenesis，Fig 18.5, Table 18.1）</b>：女性早在孕第 4 個月末腺泡就具備分泌能力（靠 E₂、P₄ 與局部 EGF/TGFα，不像其他物種須靠 hPL/GH），但孕期超高 <b>P₄ 與 E₂ 直接使腺泡對「孕期飆高之泌乳素（PRL）」不反應（踩住煞車！）</b>。分娩排出胎盤後 <b>P₄/E₂ 斷崖暴跌解除煞車</b>，仍在高位的 PRL 立刻引爆初乳與泌乳！無吸吮刺激時僅能零星泌乳約 3–4 週。</li>
  <li><b>斷奶萎縮（Involution，~3 個月）</b>：停餵後乳汁淤積漲壓上皮並壓扁微血管引發局部缺氧與細胞脫落吞噬（靠<b>局部機械張力因子</b>抑制而非血中 PRL 下降為主）；但乳房內孕期新增之脂肪與結締組織使產後體積仍常大於孕前。</li>
</ul>
<h3>18-2 雙重神經內分泌反射：造乳（PRL）vs 排乳（Oxytocin）（Figs 18.6–18.7）</h3>
<ul>
  <li><b>造乳維持（Lactopoiesis：吸吮→PRL 反射，Fig 18.6）</b>：<ul>
    <li><b>只能由真實吸吮乳頭觸發</b>（不像排乳能被哭聲條件反射！）：傳入神經經脊髓前外側柱上行調控下視丘弓狀核 <b>TIDA 神經元降低分泌抑制因子「多巴胺（PIF）」</b>，並上升 PVN 之 <b>血管活性腸肽（VIP）</b>入門脈，在低多巴胺敏感化下激發垂體前葉脈衝分泌 <b>PRL</b>（雙胞胎雙側同時親餵釋放倍增）——相當於「嬰兒在吃這一餐時下單下一餐」！</li>
    <li>PRL 啟動乳上皮合成 <b>α-乳白蛋白（α-lactalbumin）＋ 半乳糖基轉移酶（galactosyltransferase）＝ 乳糖合成酶（高基氏體）</b>與酪蛋白胞吐，同時促使平滑內質網合成之乳脂球以<b>頂漿突分泌方式（apocrine pinching）</b>裹膜排出！</li>
    <li><b>泌乳期不孕與停乳用藥</b>：高 PRL 抑制 GnRH/LH 脈衝造成哺乳期無月經，但排卵仍常在第一次月經來之前就悄然恢復（9 個月無避孕親餵仍有約半數受孕！）。抑制泌乳首選 <b>多巴胺 D2 致效劑（Bromocriptine / Cabergoline）</b>（pp. 305, 348）。</li>
  </ul></li>
  <li><b>排乳反射（Milk Ejection Reflex, MER，Fig 18.7）</b>：吸吮觸壓（亦可被<b>嬰兒哭聲、牛聽見擠奶桶聲、甚至子宮頸與陰道擴張</b>所觸發！）經脊髓前外側柱 → 中腦 <b>peripeduncular nucleus</b> → 內側前腦束（MFB）→ 下視丘 <b>PVN/SON</b> 從垂體後葉分泌 <b>催產素（Oxytocin）</b> → 引起腺泡<b>肌上皮細胞收縮</b>產生「噴奶（milk let-down）」。<b>心理壓力或疼痛（腎上腺素收縮乳腺血管或抑中樞）會強烈阻斷 MER</b>！嬰兒是用舌頭壓抵硬顎將乳頭基部向尖端「擠壓（stripping）」配合吸力喝奶（與僵硬奶嘴不同）。</li>
</ul>
<h3>18-3 初乳／成熟乳成分、免疫益處與母嬰垂直感染（Box 18.1, Table 18.2）</h3>
<ul>
  <li><b>成分演變（Table 18.2）</b>：<b>初乳（Colostrum，第 1 週 ≤40 ml/天）</b>富含 <b>蛋白質、IgG、乳鐵蛋白、溶菌酶與脂溶性維生素（A/D/E/K）</b>但較少脂肪乳糖；2–3 週過渡為<b>成熟乳（65 kcal/100 ml；~90 g% 水、~7 g% 乳糖 [養殖 Lactobacillus bifidus 菌叢＋供腦髓鞘半乳糖]、極易消化乳化脂肪微粒）</b>。</li>
  <li><b>免疫微調（Box 18.1）</b>：調節無菌新生兒腸道面對細菌抗原時經 TLR 的發炎平衡（WHO 建議純母乳哺餵 6 個月）；同時促使產母子宮加速復舊減出血、減停經前乳癌風險。</li>
  <li><b>HIV 垂直感染風險權衡（p.306–307）</b>：可經胎盤（低頻）、<b>分娩期產道出血（極重要）</b>與<b>母乳哺餵（瓶餵使總傳染率減半！）</b>；在開發中貧困地區捨棄母乳雖降 HIV 卻可能因水源不潔反增腸道與營養致死率，抗反轉錄病毒藥物是目前主要解方（注意帶原母所生嬰兒 100% 在出生時抗 HIV 抗體陽性只因母體 IgG 穿過胎盤，須滿 6 個月複驗方能判別是否真正主動感染！）。</li>
</ul>`,
  quiz: [
    { q: '人體乳房早在妊娠第 4 個月就已能合成乳汁分泌物，血中的泌乳素（Prolactin）更在妊娠末期持續升高達到高峰——為什麼孕婦在生產「之前」卻不會大量泌乳？（Fig 18.5, p.300）', o: ['因為妊娠期間高濃度的雌激素與助孕素（尤其 P₄）直接抑制乳腺腺泡細胞對泌乳素的反應性（「踩住煞車」）；直到分娩胎盤排出使類固醇斷崖式暴跌解除封鎖，高位的泌乳素才能立刻啟動泌乳（Lactogenesis）', '因為妊娠期間大腦垂體根本沒有任何泌乳素神經元', '因為嬰兒在子宮內把產生的乳汁全部吸走吞掉', '因為妊娠期間肌上皮細胞完全死掉還沒有出生'], a: 0, e: 'Ch18 p.300 & Fig 18.5：流產或死胎若超過懷孕第 4 個月才發生，胎盤撤退同樣會啟動不必要的泌乳脹奶，可用多巴胺 D2 致效劑阻斷之。' },
    { q: '乳腺泌乳細胞（Fig 18.4）是如何把「乳蛋白（含乳糖）」和「乳脂肪微滴」這兩種截然不同的巨分子排出進入腺泡腔中的？（p.301, 305–306）', o: ['蛋白質與乳糖（在高基氏體由 PRL 刺激 α-乳白蛋白＋半乳糖基轉移酶結合而成）裝入分泌囊泡經「胞吐（exocytosis）」排出；乳脂肪則由平滑內質網合成大油滴推頂質膜膨出並掐斷「頂漿分泌（apocrine）」包著雙層膜排出！', '兩者都在細胞質直接融化後讓細胞破裂整顆死掉排出（全漿分泌）', '乳糖完全從母親腎臟過濾經動脈直接灌進乳腺管', '乳脂是由肌上皮細胞在細胞外空間合成的'], a: 0, e: 'Ch18 p.301, 305–306 & Fig 18.4：母乳中 7 g% 的乳糖甜度低，是專為培養雙歧桿菌（Lactobacillus bifidus）與提供神經髓鞘化所需「半乳糖」而設計！' },
    { q: '比較嬰兒親餵引發的「造乳反射（PRL 釋放，Fig 18.6）」與「排乳反射（MER，Fig 18.7）」在反射開關條件與下視丘路徑上的關鍵差異為何？（p.302–304）', o: ['排乳反射（PVN/SON 釋放催產素收縮肌上皮細胞）可經「聽見嬰兒哭聲、牛聽見擠奶桶聲或陰道擴張」產生條件反射，且極易受焦慮／腎上腺素阻斷；而泌乳素反射（抑 TIDA 多巴胺＋促 PVN 釋 VIP）幾乎完全必須仰賴「實際吸吮乳頭的體感覺刺激」才啟動！', '聽見嬰兒哭聲能讓血液泌乳素（PRL）立即暴衝 50 倍就算完全不親餵', '排乳反射是由垂體前葉的多巴胺直接讓肌上皮舒張完成', '吸吮刺激會讓 TIDA 神經元大量分泌多巴胺（PIF）來暴衝泌乳素'], a: 0, e: 'Ch18 p.303–304, Figs 18.6–18.7：多巴胺正是 PIF（泌乳素抑制因子），因此吸吮神經必須「減少」TIDA 多巴胺分泌並提升 VIP，才能釋放大量 PRL！' },
    { q: '關於臨床上想要人工壓抑不必要泌乳的藥理處置，以及自然停止親餵（斷奶後約 3 個月）乳腺停止造乳並萎縮的機制，下列何者正確？（p.305）', o: ['臨床首選「多巴胺 D₂ 受體致效劑（如 Bromocriptine, Cabergoline）」直接模擬 PIF 壓低 PRL；至於自然斷奶停止泌乳的主因並非血 PRL 先跌，而是「乳汁淤積於腺泡產生機械壓迫與微血管缺氧」使分泌上皮局部萎縮吞噬！', '停乳臨床首選注射大量催產素並給多巴胺受體阻斷劑', '自然斷奶的乳房在 3 小時內就會完全消退變回兒童期只有未分支乳管', '服用含雌激素或神經安定劑（多巴胺拮抗劑）能徹底阻斷泌乳'], a: 0, e: 'Ch18 p.305：抗精神病藥（多巴胺拮抗劑）反而會移除 PIF 造成高泌乳素血症與溢乳（參見 Ch21 p.348）！' },
    { q: '比較產後第一週的「初乳（Colostrum，每日僅 ≤40 ml）」與 2–3 週後「成熟乳（Mature milk）」成分差異，以及嬰兒吸吮力學機轉（p.304–306, Table 18.2），何者正確？', o: ['初乳的脂肪、乳糖與水溶性 B/C 維生素比成熟乳「少」，但蛋白質、抗體 IgG、礦物質與脂溶性維生素（A/D/E/K）遠高於成熟乳；親餵時嬰兒主要是靠舌頭壓抵硬顎從乳暈基部向乳頭尖端「擠壓（stripping）」配合吸力取出乳汁', '初乳是純水與純糖，完全沒有任何蛋白質與抗體', '牛羊胎兒早在子宮內靠胎盤傳完 IgG，根本不需要喝初乳', '親餵與用硬奶嘴喝奶的口腔擠壓方式完全相同'], a: 0, e: 'Ch18 p.304–306, Table 18.2：成熟母乳含 ~90 g% 水與 ~7 g% 乳糖，熱量 65 kcal/100 ml；另記得人類嬰兒可經胎盤傳 IgG 而牛羊豬則須仰賴初乳！' },
    { q: '產後純母乳哺餵的母親常處於「泌乳性無月經（lactational amenorrhoea）」，但醫師仍必須警告她注意什麼關鍵事實？（p.305）', o: ['產後約 6 週內雖極少排卵且多在 3–6 個月恢復，但「月經來潮是判斷恢復生育力的極劣指標」，因為排卵常在第一次產後月經來之前就已發生（未避孕泌乳婦女在 9 個月內仍有約一半會受孕）！', '只要還在餵母乳一天，人類女性終生 100% 絕對不可能排卵或受孕', '催產素是抑制下視丘 GnRH 的唯一分子，與泌乳素完全無關', '第一次產後出血一定發生在任何排卵之前 6 個月'], a: 0, e: 'Ch18 p.305：原因在於第一次產後排卵產生黃體或無黃體前即已先授精，在月經尚未出現前就已經懷孕！' },
    { q: '關於愛滋病（HIV）陽性產婦垂直傳染給胎兒與嬰兒的三條路徑及診斷陷阱（p.306–307），下列敘述何者正確？', o: ['垂直感染可經子宮內胎盤（低頻）、分娩時接觸母血（高危）與哺乳（瓶餵可將母乳途徑降半）；注意 HIV+ 母親所生嬰兒「出生時 100% 抗 HIV 抗體陽性」，因母體 IgG 會經胎盤傳給胎兒，須在無餵母乳 6 個月後複檢抗體是否仍陽性才能診斷嬰兒自身感染！', '胎盤是 HIV 傳給新生兒最主要且 100% 傳染的唯一路徑', '只要出生第一天抽血測到抗 HIV 抗體陽性就代表胎兒必然感染 HIV 病毒無誤', '母乳含有一種酵素能把 HIV 病毒當場消滅 100%'], a: 0, e: 'Ch18 p.306–307：抗反轉錄病毒藥物能大幅壓低三條路徑的垂直傳染率；在缺乏乾淨飲水或奶粉的貧困地區改用瓶餵需同時評估腹瀉致死替代風險。' },
    { q: '比較大鼠、兔、人與反芻家畜（牛／山羊）之乳腺輸乳導管構造（Box 18.2, Fig 18.2），哪一種動物於單側乳頭下彙集成 15–20 條各自獨立開孔的輸乳竇，而牛／羊則擁有巨大的蓄乳構造？', o: ['人類每位乳房 15–20 葉各有獨立輸乳竇並分別開口於乳頭表面；牛與山羊則將各導管彙進一個寬大的「乳腺池（gland cistern）」與「乳頭池（teat cistern）」再通乳頭管（大鼠全部僅匯為單一乳管開口）', '人類整個乳房的所有葉最後也全部匯聚為單一一條主導管出口', '大鼠的乳房在背部且共有 200 個乳頭開口', '牛的乳房只有 20 條獨立小孔開口於人類一樣的乳暈表面'], a: 0, e: 'Ch18 Box 18.2 & Fig 18.2：清晰對比四類動物（大鼠單管、兔多管、人 15–20 葉各自開口、反芻大蓄乳池），亦為乳牛擠乳力學的解剖基礎。' }
  ]
};
